    function GuidingFrameworkBody({ frameworkId }) {
      if (frameworkId === "cfir") {
        return (
          <>
            <p>
              The <strong>Consolidated Framework for Implementation Research (CFIR)</strong>{" "}
              helps identify multilevel barriers and facilitators that may influence
              implementation outcomes. In mid-design evaluation planning, CFIR can be
              used to structure inquiry into contextual factors that may affect whether
              a health care innovation is perceived as appropriate, feasible,
              acceptable, adoptable, integrable, or sustainable in real-world settings.
            </p>
            <p>
              The updated CFIR includes five domains: <strong>Innovation</strong>,{" "}
              <strong>Outer Setting</strong>, <strong>Inner Setting</strong>,{" "}
              <strong>Individuals</strong>, and <strong>Implementation Process</strong>.
              Within each domain, CFIR constructs can inform interview guide development,
              qualitative coding, mixed-method interpretation, and anticipatory
              identification of implementation risks. Because CFIR is a generalized
              framework, teams should not examine every construct automatically.
              Instead, they should define the health care innovation, setting, relevant
              roles, and implementation process, then select and adapt constructs that
              are meaningful for the specific innovation and the individuals involved
              in implementing or delivering it.
            </p>
            <p>
              CFIR is especially useful for collecting data from individuals who have
              power and/or influence over implementation outcomes, such as organizational
              leaders, clinical leadership, future users, implementation support
              personnel, and other groups involved in implementation decisions. Although
              CFIR is most commonly applied through qualitative methods, it can also
              support structured interpretation by applying ratings of{" "}
              <strong>valence</strong>, or whether a construct functions as a barrier or
              facilitator, and <strong>strength</strong>, or how strongly the construct
              appears to influence implementation. These ratings should be interpreted
              carefully because responses about the “degree to which” a construct
              manifests may reflect both subjective judgment and objective contextual
              conditions.
            </p>
          </>
        );
      }

      if (frameworkId === "ddbt") {
        return (
          <>
            <p>
              The <strong>Discover, Design/Build, and Test (DDBT)</strong> framework can
              help teams use human-centered design methods to identify and address
              usability challenges before implementation. In mid-design evaluation
              planning, DDBT is useful when the innovation or its implementation strategy
              still needs to be refined based on interest-holder needs, workflow
              constraints, learnability, usability, and contextual fit.
            </p>
            <p>
              DDBT treats usability as an implementation determinant rather than as a
              standalone implementation outcome. Usability challenges may affect several
              implementation outcomes, including appropriateness, feasibility,
              acceptability, adoption, fidelity, implementation cost, and sustainability.
              DDBT is especially useful for engaging <strong>primary users</strong>, or
              those whose activities are most directly connected to the innovation and
              whose needs and constraints should be prioritized in redesign.
            </p>
            <p>
              Because DDBT was developed in relation to evidence-based psychosocial
              interventions and implementation strategies, teams should adapt its phases
              and methods to fit the health care innovation, setting, and available
              evaluation resources.
            </p>
          </>
        );
      }

      if (frameworkId === "seips") {
        return (
          <>
            <p>
              The <strong>Systems Engineering Initiative for Patient Safety Model
              (SEIPS)</strong> can help teams examine whether a health care innovation
              fits the work system in which it will be used. In mid-design evaluation
              planning, SEIPS is especially useful for considering how people, tasks,
              tools and technologies, physical environment, and organizational
              conditions may interact to shape future clinical processes and
              implementation outcomes.
            </p>
            <p>
              SEIPS can guide interviews, observations, workflow analysis, and design
              reviews by helping teams examine whether the innovation aligns with users’
              skills and roles, task demands, existing technologies, spatial constraints,
              communication patterns, staffing structures, and organizational routines.
              This is particularly relevant because implementation problems often arise
              not only from individual behavior but from mismatches between the innovation
              and the surrounding work system.
            </p>
            <p>
              For mid-design evaluation planning, SEIPS can help teams identify where
              the innovation may create new workload, coordination demands, usability
              problems, safety risks, or workflow disruptions before the design is
              finalized.
            </p>
          </>
        );
      }

      if (frameworkId === "prism") {
        return (
          <>
            <p>
              The <strong>Practical, Robust Implementation and Sustainability Model
              (PRISM)</strong> is an overarching implementation model that can support
              systematic identification and evaluation planning around multilevel
              contextual factors, including variability in operational processes and
              available resources.
            </p>
            <p>
              In mid-design evaluation planning, PRISM can guide qualitative interviews,
              site reviews, document review, and interest-holder discussions. It is
              particularly helpful for identifying purposeful design changes before
              implementation, such as adapting workflow procedures, clarifying roles,
              strengthening referral pathways, improving training supports, or aligning
              the innovation with organizational priorities and external constraints.
            </p>
            <p>
              PRISM is especially useful when teams want to anticipate how intervention
              design, recipients, organizational characteristics, implementation and
              sustainability infrastructure, and the external environment may shape
              adoption, implementation consistency, penetration, and sustainability.
            </p>
          </>
        );
      }

      return (
        <>
          <p>
            The <strong>Reach, Effectiveness, Adoption, Implementation, Maintenance
            Framework (RE-AIM)</strong> helps teams consider the broader public health
            and organizational impact of an innovation. Although RE-AIM does not map
            one-to-one onto the implementation outcomes in this guide, its dimensions
            overlap with and complement several outcomes, especially adoption, fidelity
            or implementation consistency, penetration, implementation cost, and
            sustainability.
          </p>
          <p>
            In mid-design evaluation planning, RE-AIM can be used as a pragmatic
            planning framework rather than as a full outcome evaluation. It can help
            teams ask who the innovation is intended to reach, what benefits and
            unintended consequences matter, where and by whom the innovation would be
            adopted, how consistently it could be delivered, what adaptations and costs
            may arise, and whether it could be maintained over time.
          </p>
          <p>
            These “who, what, where, how, when, and why” questions are especially useful
            when evaluation resources are limited and teams need to prioritize which
            implementation risks to explore before full implementation.
          </p>
        </>
      );
    }

    function ResourceCaseOutcomeEvidence({ caseId }) {
      const evidenceItems = OUTCOMES.flatMap((outcome) => {
        const evidence = (outcome.evidence || []).find(
          (entry) => entry.caseId === caseId
        );

        return evidence ? [{ outcome, evidence }] : [];
      });

      return (
        <div className="resource-outcome-evidence-list">
          {evidenceItems.map(({ outcome, evidence }) => (
            <article
              className="resource-outcome-evidence"
              key={`${caseId}-${outcome.id}`}
            >
              <h5>{outcome.name}</h5>
              <p>
                <CitationText text={evidence.appearance} />
              </p>
              <span className="resource-evidence-relationship">
                {evidence.relationship}
              </span>
            </article>
          ))}
        </div>
      );
    }

    function ResourceCaseExample({ caseId }) {
      const caseData = CASES[caseId];

      return (
        <details className="resource-case-item">
          <summary>
            <span className="resource-summary-copy">
              <span className="resource-case-name">
                {caseData.name}
                <CitationNumbers ids={CASE_REFERENCE_IDS[caseId]} />
              </span>
            </span>
            <span className="resource-summary-action">
              <span className="closed-label">View case details</span>
              <span className="open-label">Hide case details</span>
              <span className="resource-summary-arrow" aria-hidden="true">↓</span>
            </span>
          </summary>

          <div className="resource-case-body">
            <section className="resource-case-subsection">
              <h4>Case Context</h4>
              <dl className="resource-case-context">
                {caseData.context.map((item) => (
                  <React.Fragment key={item.label}>
                    <dt>{item.label}</dt>
                    <dd>{item.value}</dd>
                  </React.Fragment>
                ))}
              </dl>
            </section>

            <section className="resource-case-subsection">
              <h4>Implementation Outcomes</h4>
              <ResourceCaseOutcomeEvidence caseId={caseId} />
            </section>

            <section className="resource-case-subsection">
              <h4>Interest Holders</h4>
              <CaseNarrative
                caseId={caseId}
                variant="interest-holders"
              />
            </section>

            <section className="resource-case-subsection">
              <h4>Evaluation Strategies</h4>
              <CaseNarrative
                caseId={caseId}
                variant="evaluation-strategies"
              />
            </section>
          </div>
        </details>
      );
    }

    function CompleteReferenceList() {
      return (
        <>
          <p className="complete-reference-note">
            Reference numbers correspond to the order in which sources first appear
            in the guide.
          </p>

          <ol className="complete-reference-list">
            {REFERENCE_ORDER.map((referenceId) => {
              const reference = REFERENCE_LIBRARY[referenceId];
              const number = REFERENCE_NUMBER_BY_ID[referenceId];

              return (
                <li id={`reference-${number}`} key={referenceId}>
                  {reference.citation}{" "}
                  <a
                    href={reference.url}
                    target="_blank"
                    rel="noreferrer"
                  >
                    {reference.url}
                  </a>
                </li>
              );
            })}
          </ol>
        </>
      );
    }

    function ResourcesPage() {
      return (
        <>
          <section
            className="hero compact"
            aria-labelledby="resources-page-title"
          >
            <div className="container">
              <div className="eyebrow">
                Supporting material
              </div>

              <h1 id="resources-page-title">Resources</h1>

              <p className="lede">
                Use these resources to explore the guiding frameworks, review the
                health care case examples, and access the complete references
                supporting the guide.
              </p>
            </div>
          </section>

          <section className="section">
            <div className="container">
              <div className="resources-library">
                <details className="resource-section-card">
                  <summary>
                    <span className="resource-summary-copy">
                      <span className="resource-summary-title">
                        Guiding Frameworks
                      </span>
                      <span className="resource-summary-description">
                        Review implementation, human factors, and design frameworks
                        that can support mid-design evaluation planning.
                      </span>
                    </span>
                    <span className="resource-summary-action">
                      <span className="closed-label">View Guiding Frameworks</span>
                      <span className="open-label">Hide Guiding Frameworks</span>
                      <span className="resource-summary-arrow" aria-hidden="true">↓</span>
                    </span>
                  </summary>

                  <div className="resource-section-content">
                    <div className="framework-resource-list">
                      {GUIDING_FRAMEWORKS.map((framework) => (
                        <details
                          className="framework-resource-item"
                          key={framework.id}
                        >
                          <summary>
                            <span className="resource-summary-copy">
                              <span className="framework-resource-name">
                                {framework.name}
                                <CitationNumbers ids={framework.citationIds} />
                              </span>
                              <span className="framework-resource-summary">
                                {framework.summary}
                              </span>
                            </span>
                            <span className="resource-summary-action">
                              <span className="closed-label">
                                View framework details
                              </span>
                              <span className="open-label">
                                Hide framework details
                              </span>
                              <span
                                className="resource-summary-arrow"
                                aria-hidden="true"
                              >
                                ↓
                              </span>
                            </span>
                          </summary>

                          <div className="framework-resource-body">
                            <GuidingFrameworkBody frameworkId={framework.id} />
                          </div>
                        </details>
                      ))}
                    </div>
                  </div>
                </details>

                <details className="resource-section-card">
                  <summary>
                    <span className="resource-summary-copy">
                      <span className="resource-summary-title">
                        Health Care Case Examples
                      </span>
                      <span className="resource-summary-description">
                        See how implementation outcomes, interest holders, and
                        evaluation strategies come together across three health
                        innovation projects.
                      </span>
                    </span>
                    <span className="resource-summary-action">
                      <span className="closed-label">View Case Examples</span>
                      <span className="open-label">Hide Case Examples</span>
                      <span className="resource-summary-arrow" aria-hidden="true">↓</span>
                    </span>
                  </summary>

                  <div className="resource-section-content">
                    <div className="resource-case-list">
                      {["hpv", "ecv", "contraception"].map((caseId) => (
                        <ResourceCaseExample
                          caseId={caseId}
                          key={caseId}
                        />
                      ))}
                    </div>
                  </div>
                </details>

                <details className="resource-section-card">
                  <summary>
                    <span className="resource-summary-copy">
                      <span className="resource-summary-title">
                        Complete References
                      </span>
                      <span className="resource-summary-description">
                        Find the complete APA-formatted references for sources cited
                        throughout the guide.
                      </span>
                    </span>
                    <span className="resource-summary-action">
                      <span className="closed-label">
                        View Complete References
                      </span>
                      <span className="open-label">
                        Hide Complete References
                      </span>
                      <span className="resource-summary-arrow" aria-hidden="true">↓</span>
                    </span>
                  </summary>

                  <div className="resource-section-content">
                    <CompleteReferenceList />
                  </div>
                </details>
              </div>
            </div>
          </section>
        </>
      );
    }

    // ============================================================
    // APPLICATION
    // ============================================================

    function App() {
      const [route, setRoute] = useState(getRoute());
      const [implementationOutcomeSelections, setImplementationOutcomeSelections] =
        useState([]);
      const [interestHolderSelections, setInterestHolderSelections] =
        useState({});
      const [interestHolderDetails, setInterestHolderDetails] =
        useState({});
      const [customInterestHolderGroups, setCustomInterestHolderGroups] =
        useState([]);
      const [customInterestHolderSelections, setCustomInterestHolderSelections] =
        useState({});
      const [
        evaluationStrategySelections,
        setEvaluationStrategySelections,
      ] = useState({});
      const [evaluationStrategyNotes, setEvaluationStrategyNotes] =
        useState({});
      const [interviewPromptSelections, setInterviewPromptSelections] =
        useState({});
      const [customInterviewPrompts, setCustomInterviewPrompts] =
        useState({});
      const [implementationOutcomesReflection, setImplementationOutcomesReflection] =
        useState("");
      const [interestHoldersReflection, setInterestHoldersReflection] =
        useState("");
      const [evaluationStrategiesReflection, setEvaluationStrategiesReflection] =
        useState("");

      function toggleImplementationOutcome(outcomeId) {
        setImplementationOutcomeSelections((currentSelections) => {
          const nextSelections = new Set(currentSelections);

          if (nextSelections.has(outcomeId)) {
            nextSelections.delete(outcomeId);
          } else {
            nextSelections.add(outcomeId);
          }

          return Array.from(nextSelections);
        });
      }

      function toggleInterestHolder(outcomeId, roleId) {
        setInterestHolderSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(roleId)) {
            currentOutcomeSelections.delete(roleId);
          } else {
            currentOutcomeSelections.add(roleId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      function addCustomInterestHolder(outcomeId, name, note) {
        const customId = `custom-${Date.now()}-${Math.random()
          .toString(36)
          .slice(2, 8)}`;

        setCustomInterestHolderGroups((currentGroups) => [
          ...currentGroups,
          {
            id: customId,
            name,
            note,
          },
        ]);

        setCustomInterestHolderSelections((currentSelections) => ({
          ...currentSelections,
          [outcomeId]: [
            ...(currentSelections[outcomeId] || []),
            customId,
          ],
        }));
      }

      function toggleCustomInterestHolder(outcomeId, customId) {
        setCustomInterestHolderSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(customId)) {
            currentOutcomeSelections.delete(customId);
          } else {
            currentOutcomeSelections.add(customId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      function removeCustomInterestHolder(customId) {
        setCustomInterestHolderGroups((currentGroups) =>
          currentGroups.filter((group) => group.id !== customId)
        );

        setCustomInterestHolderSelections((currentSelections) => {
          const nextSelections = {};

          Object.entries(currentSelections).forEach(
            ([outcomeId, outcomeSelections]) => {
              nextSelections[outcomeId] = outcomeSelections.filter(
                (id) => id !== customId
              );
            }
          );

          return nextSelections;
        });
      }

      function updateInterestHolderDetail(
        outcomeId,
        roleId,
        field,
        value
      ) {
        setInterestHolderDetails((currentDetails) => ({
          ...currentDetails,
          [outcomeId]: {
            ...(currentDetails[outcomeId] || {}),
            [roleId]: {
              ...(currentDetails[outcomeId]?.[roleId] || {}),
              [field]: value,
            },
          },
        }));
      }

      function toggleEvaluationStrategy(
        outcomeId,
        groupId,
        strategyId
      ) {
        setEvaluationStrategySelections((currentSelections) => {
          const currentOutcomeSelections =
            currentSelections[outcomeId] || {};
          const currentGroupSelections = new Set(
            currentOutcomeSelections[groupId] || []
          );

          if (currentGroupSelections.has(strategyId)) {
            currentGroupSelections.delete(strategyId);
          } else {
            currentGroupSelections.add(strategyId);
          }

          return {
            ...currentSelections,
            [outcomeId]: {
              ...currentOutcomeSelections,
              [groupId]: Array.from(currentGroupSelections),
            },
          };
        });
      }

      function updateEvaluationStrategyNote(
        outcomeId,
        strategyId,
        value
      ) {
        setEvaluationStrategyNotes((currentNotes) => ({
          ...currentNotes,
          [outcomeId]: {
            ...(currentNotes[outcomeId] || {}),
            [strategyId]: value,
          },
        }));
      }

      function toggleInterviewPrompt(outcomeId, promptId) {
        setInterviewPromptSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(promptId)) {
            currentOutcomeSelections.delete(promptId);
          } else {
            currentOutcomeSelections.add(promptId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      function addCustomInterviewPrompt(outcomeId, title, question) {
        const promptId = `custom-prompt-${Date.now()}-${Math.random()
          .toString(36)
          .slice(2, 8)}`;

        setCustomInterviewPrompts((currentPrompts) => ({
          ...currentPrompts,
          [outcomeId]: [
            ...(currentPrompts[outcomeId] || []),
            { id: promptId, title, question },
          ],
        }));
      }

      function removeCustomInterviewPrompt(outcomeId, promptId) {
        setCustomInterviewPrompts((currentPrompts) => ({
          ...currentPrompts,
          [outcomeId]: (currentPrompts[outcomeId] || []).filter(
            (prompt) => prompt.id !== promptId
          ),
        }));
      }

      useEffect(() => {
        function handleHashChange() {
          const hash = window.location.hash.replace("#", "");
          const nextRoute = getRoute();

          if (hash === "main-content") {
            window.requestAnimationFrame(() => {
              document.getElementById("main-content")?.focus();
            });

            return;
          }

          if (START_SECTION_HASHES.includes(hash)) {
            setRoute("start");

            window.requestAnimationFrame(() => {
              document
                .getElementById(hash)
                ?.scrollIntoView({
                  behavior: "smooth",
                  block: "start",
                });
            });

            return;
          }

          setRoute(nextRoute);
          window.scrollTo({
            top: 0,
            behavior: "auto",
          });
        }

        window.addEventListener(
          "hashchange",
          handleHashChange
        );

        if (!window.location.hash) {
          window.history.replaceState(
            null,
            "",
            "#start"
          );
        } else if (
          START_SECTION_HASHES.includes(
            window.location.hash.replace("#", "")
          )
        ) {
          handleHashChange();
        }

        return () =>
          window.removeEventListener(
            "hashchange",
            handleHashChange
          );
      }, []);

      let currentPage;

      if (route === "outcomes") {
        currentPage = (
          <ExploreOutcomesPage
            implementationOutcomeSelections={
              implementationOutcomeSelections
            }
            onToggleImplementationOutcome={
              toggleImplementationOutcome
            }
            reflectionNote={implementationOutcomesReflection}
            onChangeReflectionNote={setImplementationOutcomesReflection}
          />
        );
      } else if (route === "interest-holders") {
        currentPage = (
          <ExploreInterestHoldersPage
            interestHolderSelections={interestHolderSelections}
            onToggleInterestHolder={toggleInterestHolder}
            interestHolderDetails={interestHolderDetails}
            onUpdateInterestHolderDetail={updateInterestHolderDetail}
            customInterestHolderGroups={customInterestHolderGroups}
            customInterestHolderSelections={customInterestHolderSelections}
            onAddCustomInterestHolder={addCustomInterestHolder}
            onToggleCustomInterestHolder={toggleCustomInterestHolder}
            onRemoveCustomInterestHolder={removeCustomInterestHolder}
            reflectionNote={interestHoldersReflection}
            onChangeReflectionNote={setInterestHoldersReflection}
          />
        );
      } else if (route === "evaluation-strategies") {
        currentPage = (
          <ExploreEvaluationStrategiesPage
            evaluationStrategySelections={
              evaluationStrategySelections
            }
            onToggleEvaluationStrategy={
              toggleEvaluationStrategy
            }
            evaluationStrategyNotes={evaluationStrategyNotes}
            onUpdateEvaluationStrategyNote={
              updateEvaluationStrategyNote
            }
            interviewPromptSelections={
              interviewPromptSelections
            }
            onToggleInterviewPrompt={toggleInterviewPrompt}
            reflectionNote={evaluationStrategiesReflection}
            onChangeReflectionNote={setEvaluationStrategiesReflection}
          />
        );
      } else if (route === "final-plan") {
        currentPage = (
          <DevelopEvaluationPlanPage
            implementationOutcomeSelections={implementationOutcomeSelections}
            onToggleImplementationOutcome={toggleImplementationOutcome}
            interestHolderSelections={interestHolderSelections}
            onToggleInterestHolder={toggleInterestHolder}
            interestHolderDetails={interestHolderDetails}
            onUpdateInterestHolderDetail={updateInterestHolderDetail}
            customInterestHolderGroups={customInterestHolderGroups}
            customInterestHolderSelections={customInterestHolderSelections}
            onAddCustomInterestHolder={addCustomInterestHolder}
            onToggleCustomInterestHolder={toggleCustomInterestHolder}
            onRemoveCustomInterestHolder={removeCustomInterestHolder}
            evaluationStrategySelections={evaluationStrategySelections}
            onToggleEvaluationStrategy={toggleEvaluationStrategy}
            evaluationStrategyNotes={evaluationStrategyNotes}
            onUpdateEvaluationStrategyNote={updateEvaluationStrategyNote}
            interviewPromptSelections={interviewPromptSelections}
            onToggleInterviewPrompt={toggleInterviewPrompt}
            customInterviewPrompts={customInterviewPrompts}
            onAddCustomInterviewPrompt={addCustomInterviewPrompt}
            onRemoveCustomInterviewPrompt={removeCustomInterviewPrompt}
            implementationOutcomesReflection={implementationOutcomesReflection}
            interestHoldersReflection={interestHoldersReflection}
            evaluationStrategiesReflection={evaluationStrategiesReflection}
          />
        );
      } else if (route === "resources") {
        currentPage = <ResourcesPage />;
      } else {
        currentPage = <StartHerePage />;
      }

      return (
        <>
          <Navigation route={route} />

          <main id="main-content" tabIndex="-1">
            {currentPage}
          </main>

          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);
  </script>
</body>
</html>
