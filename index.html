    function CustomInterestHolderPanel({
      activeOutcome,
      customGroups,
      customSelections,
      onAddCustomGroup,
      onToggleCustomGroup,
      onRemoveCustomGroup,
    }) {
      const [groupName, setGroupName] = useState("");
      const [groupNote, setGroupNote] = useState("");
      const selectedForOutcome = new Set(
        customSelections[activeOutcome.id] || []
      );

      function handleSubmit(event) {
        event.preventDefault();
        const trimmedName = groupName.trim();
        if (!trimmedName) return;

        onAddCustomGroup(
          activeOutcome.id,
          trimmedName,
          groupNote.trim()
        );
        setGroupName("");
        setGroupNote("");
      }

      return (
        <section
          className="custom-interest-holder-panel"
          aria-labelledby="custom-interest-holder-title"
        >
          <div className="custom-interest-holder-intro">
            <div className="placeholder-label">Project-specific group</div>
            <h3 id="custom-interest-holder-title">
              Add an interest-holder group not captured by the scaffold
            </h3>
            <p>
              If there are other interest-holder groups relevant to your project
              that are not captured by the scaffold, add them here and, if useful,
              note why their perspective matters.
            </p>
          </div>

          <form className="custom-interest-holder-form" onSubmit={handleSubmit}>
            <label>
              <span>Group name</span>
              <input
                type="text"
                value={groupName}
                onChange={(event) => setGroupName(event.target.value)}
                placeholder="e.g., Local referral coordinators"
              />
            </label>

            <label>
              <span>Why this group's perspective matters <em>(optional)</em></span>
              <textarea
                value={groupNote}
                onChange={(event) => setGroupNote(event.target.value)}
                placeholder="Add a short project-specific note."
              />
            </label>

            <button className="button secondary" type="submit">
              Add to {activeOutcome.name} plan
            </button>
          </form>

          {customGroups.length > 0 && (
            <div className="custom-interest-holder-list">
              {customGroups.map((group) => {
                const isSelected = selectedForOutcome.has(group.id);
                const selectedOutcomeNames = OUTCOMES.filter((outcome) =>
                  (customSelections[outcome.id] || []).includes(group.id)
                ).map((outcome) => outcome.name);

                return (
                  <article
                    className={`custom-interest-holder-item${
                      isSelected ? " is-selected" : ""
                    }`}
                    key={group.id}
                  >
                    <div>
                      <h4>{group.name}</h4>
                      {group.note && <p>{group.note}</p>}
                      {selectedOutcomeNames.length > 0 && (
                        <span className="custom-interest-holder-meta">
                          In plan for: {selectedOutcomeNames.join(", ")}
                        </span>
                      )}
                    </div>

                    <div className="custom-interest-holder-actions">
                      <button
                        className="text-action-button"
                        type="button"
                        aria-pressed={isSelected}
                        onClick={() =>
                          onToggleCustomGroup(activeOutcome.id, group.id)
                        }
                      >
                        {isSelected
                          ? `Remove from ${activeOutcome.name}`
                          : `Add to ${activeOutcome.name}`}
                      </button>
                      <button
                        className="text-action-button quiet"
                        type="button"
                        onClick={() => onRemoveCustomGroup(group.id)}
                      >
                        Delete custom group
                      </button>
                    </div>
                  </article>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    function CaseNarrative({ caseId, variant }) {
      const isInterestHolderEvidence = variant === "interest-holders";

      if (caseId === "hpv") {
        return isInterestHolderEvidence ? (
          <p>
            Key interest holders included patients using the urine-collection
            device as <strong>Immediate/direct beneficiaries</strong>; OBGYN
            clinicians as <strong>Users/operators</strong> and clinical
            evaluators; and <strong>Learners/people being trained</strong>,
            including house officers, junior residents, and senior residents,
            alongside consultant clinicians at Korle Bu Teaching Hospital. The
            clinician validation study enrolled 36 OBGYNs across these four
            clinician groups.
          </p>
        ) : (
          <p>
            The project used both patient- and clinician-facing evaluation
            strategies. A crossover study with known HPV-positive women at
            Ghana&apos;s largest referral hospital evaluated feasibility and
            acceptability using validated questionnaires and Likert-scale
            measures, including Satisfaction with Decision, Device Usability
            Questionnaire, System Usability Scale, and Device Preference
            Questionnaire. A clinician-focused descriptive study with OBGYN
            clinicians at Korle Bu Teaching Hospital evaluated acceptability,
            appropriateness, and feasibility using AIM, IAM, and FIM,
            supplemented by semi-structured interviews guided by the Theoretical
            Framework of Acceptability. Analyses included descriptive
            statistics, Wilcoxon signed-rank and binomial tests, and thematic
            analysis.
          </p>
        );
      }

      if (caseId === "ecv") {
        return isInterestHolderEvidence ? (
          <p>
            Key interest holders included{" "}
            <strong>Learners/people being trained</strong>, such as OBGYN house
            officers, junior residents, and senior residents/fellows, who were
            direct participants in the training and evaluation.{" "}
            <strong>Users/operators</strong> included clinicians expected to
            counsel patients about ECV and perform or assist with the procedure
            in clinical practice.{" "}
            <strong>
              Clinical/professional/community opinion leaders
            </strong>{" "}
            included consultants/attendings and supervising clinicians, whose
            support is important because participants identified supervision
            availability as a barrier to offering ECV.{" "}
            <strong>Implementation facilitators/change-support personnel</strong>{" "}
            included educators and simulation facilitators involved in delivering
            the program, organizing training, providing feedback, and supporting
            integration of ECV skill-building into obstetric workflow.{" "}
            <strong>Future/downstream beneficiaries</strong> were pregnant
            patients with fetal malpresentation who may benefit from improved
            clinician counseling, access to ECV, and reduced avoidable cesarean
            delivery.
          </p>
        ) : (
          <p>
            The program was evaluated through a cluster-randomized study with
            OBGYN clinicians assigned by care team to either the learning group
            or control group to reduce crossover bias. Learning-group participants
            completed the educational video, checklist handout, malpresentation
            counseling role-play, and task-trainer practice as both assisting and
            primary surgeon. Evaluation included pre/post questionnaires measuring
            comfort, confidence, and knowledge; a scored procedural checklist
            assessing ECV skill; simulation procedure success; participant
            satisfaction; and AIM, IAM, and FIM ratings for acceptability,
            appropriateness, and feasibility. Open-ended feedback was also analyzed
            thematically. Statistical analyses included paired and independent t
            tests, Fisher&apos;s exact tests, and Spearman&apos;s rho to assess
            changes in comfort, confidence, knowledge, procedural skill,
            feasibility, acceptability, and relationships among confidence,
            knowledge, and skill.
          </p>
        );
      }

      return isInterestHolderEvidence ? (
        <p>
          Key interest holders included women mentees as{" "}
          <strong>Immediate/direct beneficiaries</strong>; experienced
          contraceptive peer mentors as <strong>Innovation deliverers</strong>;
          and <strong>Implementation leads/team members</strong>, including
          community-based organizations such as Baitambogwe Community Health
          Care Initiative and AIDS Information Center, which piloted the
          intervention, recruited and trained mentors, and supported
          implementation. The pilot evaluation primarily examined how
          I-CAN&apos;s peer social support mechanisms influenced contraceptive
          agency and self-efficacy among mentees.
        </p>
      ) : (
        <p>
          The case used formative qualitative research, rapid and traditional
          qualitative analysis, human-centered design, and a six-month
          longitudinal qualitative pilot. The pilot included serial interviews
          with 25 mentees at baseline, three months, and six months, plus
          interviews with 15 comparison-group women. Participants were
          purposively sampled by contraceptive use, district, and age, and
          interview analysis was guided by the I-CAN theory of action. The
          evaluation examined how peer social support influenced contraceptive
          knowledge, partner communication, access to services, self-injection
          confidence, and ability to act on contraceptive preferences. This case
          illustrates how qualitative and mixed-method evaluation can inform
          early evaluation of acceptability and appropriateness through women&apos;s
          experiences of peer support and feasibility through implementation by
          community-based organizations and trained peer mentors.
        </p>
      );
    }

      );

        customInterestHolderSelections[selectedOutcome.id] || []
      );
      const builtInSelectionCount = Object.values(

      ).reduce(

          total + outcomeSelections.length,

      const customSelectionCount = Object.values(

      ).reduce(

          total + outcomeSelections.length,

        builtInSelectionCount + customSelectionCount;

        (customInterestHolderSelections[outcome.id] || []).length > 0

      const activeOutcomeSelectionCount =
        selectedForOutcome.size + selectedCustomForOutcome.size;

      function toggleFamily(familyId) {
        setOpenFamilyIds((current) => {
          const next = new Set(current);

            next.delete(familyId);

            next.add(familyId);

        setOpenFamilyIds((current) => {

          next.add(familyId);
          return next;

          });
        });
      }

      function selectOutcome(outcomeId) {
        setSelectedOutcomeId(outcomeId);
      }

      function handleOutcomeKeyDown(event, currentIndex) {
        let nextIndex = currentIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          nextIndex = (currentIndex + 1) % OUTCOMES.length;
        } else if (
          event.key === "ArrowUp" ||
          event.key === "ArrowLeft"
        ) {
          nextIndex =
            (currentIndex - 1 + OUTCOMES.length) %
            OUTCOMES.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = OUTCOMES.length - 1;
        } else {
          return;
        }

        event.preventDefault();
        selectOutcome(OUTCOMES[nextIndex].id);
        document
          .getElementById(
            `interest-outcome-tab-${OUTCOMES[nextIndex].id}`

          ?.focus();

            aria-labelledby="interest-holders-page-title"

            <div className="container">

              <h1 id="interest-holders-page-title">
                Discover Interest Holders

              <p className="lede">
                An <em>interest holder</em> is a group with{" "}
                <strong>
                  <code className="term-code">
                    legitimate interests
                  </code>
                </strong>{" "}
                in how a health care innovation is designed and
                implemented, and how it is experienced in use. These 
                legitimate interests are what make the group’s perspectives 
                relevant to design and implementation decisions.This
                guide uses the term to keep attention on responsibility
                and impact, not simply on organizational authority or a
                traditional stakeholder label.
              </p>

              <p className="interest-definition">
                A legitimate interest arises because people in the
                group are responsible for, or affected by, decisions
                connected to the innovation. “Interest” does not mean
                curiosity, attention, or financial return; it is closer
                to a stake, right, or entitlement. It is inherent to the
                group, even when the design team has not yet recognized
                or engaged that group.
                <CitationNumbers ids={["akl2024"]} />
              </p>

              <button
                className="scroll-prompt interest-scroll-prompt"
                type="button"
                onClick={() =>
                  document
                    .getElementById("potential-interest-holders-title")
                    ?.scrollIntoView({ behavior: "smooth", block: "start" })
                }
              >
                Explore Potential Interest Holders
                <span className="scroll-arrow" aria-hidden="true">↓</span>
              </button>
            </div>
          </section>

          <section
            className="section soft potential-interest-section"
            aria-labelledby="potential-interest-holders-title"
          >
            <div className="container">
              <SectionHeading
                eyebrow="Legitimate-interest scaffold"
                title="Potential Interest Holders"
                titleId="potential-interest-holders-title"
              >
                Use legitimate interests as a starting point instead
                of relying on a fixed list of job titles. Look for
                people or groups whose responsibilities or experiences
                connect them to how the innovation is designed,
                implemented, or experienced.
              </SectionHeading>

              <ul className="scaffold-usage-guidance">
                <li>
                  Explore each broad family and identify concrete people or
                  groups in the project context.
                </li>
                <li>
                  Use the specific-group descriptions to distinguish roles
                  whose responsibilities or exposure differ, even when the
                  same person could occupy more than one role.
                </li>
                <li>
                  Use the family and specific-group descriptions to identify
                  groups that are easy to overlook or difficult to place in a
                  single category.
                </li>
              </ul>
              <section
                className="family-overview"
                aria-labelledby="family-overview-title"
              >
                <div className="family-overview-heading">
                  <div className="placeholder-label">Broad families</div>
                  <h3 id="family-overview-title">
                    Preview all recommended interest holder families
                    <CitationNumbers ids={["akl2024", "damschroder2022"]} />
                  </h3>
                </div>
                <div className="family-overview-grid">
                  {INTEREST_HOLDER_SCAFFOLD_FAMILIES.map((family) => (
                    <InterestHolderFamilyOverview

                      isOpen={openFamilyIds.has(family.id)}

              </section>

              <div className="scaffold-family-stack">
                {INTEREST_HOLDER_SCAFFOLD_FAMILIES.map((family) => (
                  <InterestHolderFamily

                    isOpen={openFamilyIds.has(family.id)}
                    onToggle={() => toggleFamily(family.id)}

                ))}
              </div>

              <CaseExampleEvidenceSection variant="interest-holders" />

            </div>
          </section>


          <section
            className="section interest-recommendations-section"
            aria-labelledby="outcome-recommendations-title"
          >
            <div className="container">
              <SectionHeading
                eyebrow="Recommendations"
                title="Outcome-Specific Interest-Holder Recommendations"
                titleId="outcome-recommendations-title"
              >
                These are starting-point recommendations, not
                prescriptions. Review them after exploring the scaffold, then
                explicitly select the groups that belong in your evaluation
                plan based on your project context.
              </SectionHeading>

              <aside
                className="selection-guide recommendation-use-guide"
                aria-label="How to use outcome-specific recommendations"
              >
                <div className="placeholder-label">
                  How to use this section
                </div>
                <ul>
                  <li>
                    Select an implementation outcome to review potentially
                    relevant interest holders and the rationale for considering
                    them.
                  </li>
                  <li>
                    Review the recommendations for each implementation outcome
                    and identify groups that are especially informative for the
                    implementation outcome(s) of interest.
                  </li>
                  <li>
                    Add a custom group when a project-relevant interest holder
                    is not captured by the scaffold.
                  </li>

              <div className="interest-selection-summary" aria-live="polite">
                Your evaluation plan currently includes{" "}
                <strong>{totalSelections}</strong>{" "}
                {totalSelections === 1 ? "interest-holder selection" : "interest-holder selections"}

              <div className="interest-recommendations-layout">

                  {OUTCOMES.map((outcome, index) => {
                    const selectionCount =

    function ExploreEvaluationStrategiesPage({
      evaluationStrategySelections,
      onToggleEvaluationStrategy,
      evaluationStrategyNotes,
      onUpdateEvaluationStrategyNote,
      interviewPromptSelections,
      onToggleInterviewPrompt,
      reflectionNote,
      onChangeReflectionNote,
    }) {
      const [selectedOutcomeId, setSelectedOutcomeId] = useState(
        OUTCOMES[0].id
      );
      const selectedOutcome =
        OUTCOMES.find(
          (outcome) => outcome.id === selectedOutcomeId
        ) || OUTCOMES[0];
      const selectedForOutcome =
        evaluationStrategySelections[selectedOutcome.id] || {};
      const notesForOutcome =
        evaluationStrategyNotes[selectedOutcome.id] || {};
      const promptsForOutcome =
        interviewPromptSelections[selectedOutcome.id] || [];
      const totalSelections = Object.values(
        evaluationStrategySelections
      ).reduce(
        (total, outcomeSelections) =>
          total +
          Object.values(outcomeSelections).reduce(
            (outcomeTotal, groupSelections) =>
              outcomeTotal + groupSelections.length,
            0
          ),
        0
      );
      const totalPromptSelections = Object.values(
        interviewPromptSelections
      ).reduce(
        (total, promptSelections) =>
          total + promptSelections.length,
        0
      );

      function getOutcomeSelectionCount(outcomeId) {
        return Object.values(
          evaluationStrategySelections[outcomeId] || {}
        ).reduce(
          (total, groupSelections) =>
            total + groupSelections.length,
          0
        );
      }

      function selectOutcome(outcomeId) {
        setSelectedOutcomeId(outcomeId);
      }

      function handleOutcomeKeyDown(event, currentIndex) {
        let nextIndex = currentIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          nextIndex = (currentIndex + 1) % OUTCOMES.length;
        } else if (
          event.key === "ArrowUp" ||
          event.key === "ArrowLeft"
        ) {
          nextIndex =
            (currentIndex - 1 + OUTCOMES.length) %
            OUTCOMES.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = OUTCOMES.length - 1;
        } else {
          return;
        }

        event.preventDefault();
        selectOutcome(OUTCOMES[nextIndex].id);
        document
          .getElementById(
            `strategy-outcome-tab-${OUTCOMES[nextIndex].id}`
          )
          ?.focus();
      }

      return (
        <>
          <section
            className="hero compact evaluation-strategies-fullscreen-hero"
            aria-labelledby="evaluation-strategies-page-title"
          >
            <div className="container">
              <div className="eyebrow">Guide Step 3</div>

              <h1 id="evaluation-strategies-page-title">
                Discover Evaluation Strategies
              </h1>

              <p className="lede">
                <em>Evaluation strategies</em> in this guide refer to structured
                approaches for <strong><code className="term-code">gathering and interpreting evidence</code></strong>{" "}
                to evaluate implementation outcomes or anticipate implementation-related
                challenges during mid-design.
              </p>

              <p className="strategy-intro-detail">
                <strong>Qualitative strategies</strong> can help explain context,
                experience, workflow fit, perceived barriers and facilitators, and why
                implementation may or may not work. <strong>Quantitative strategies</strong>{" "}
                can help measure patterns, extent, variation, and change across
                individuals, groups, or settings.
              </p>

              <p className="strategy-intro-detail">
                When appropriate, integrating qualitative and quantitative evidence
                through <strong>mixed methods</strong> is strongly encouraged because it
                can provide a richer understanding of implementation by connecting
                measurable patterns with contextual explanations. When these forms of
                evidence are intentionally integrated, mixed methods can support more
                informed mid-design decisions.
                <CitationNumbers
                  ids={["green2015", "palinkas2011", "hamilton2019"]}
                />
              </p>

              <p className="strategy-intro-instruction">
                Select one implementation outcome at a time to review its quantitative
                and qualitative evaluation strategies, and indicate which ones you may
                want to include in your evaluation plan.
              </p>

              <button
                className="scroll-prompt evaluation-strategies-scroll-prompt"
                type="button"
                onClick={() =>
                  document
                    .getElementById("evaluation-strategies-content")
                    ?.scrollIntoView({ behavior: "smooth", block: "start" })
                }
              >
                Discover Evaluation Strategies
                <span className="scroll-arrow" aria-hidden="true">↓</span>
              </button>
            </div>
          </section>

          <section id="evaluation-strategies-content" className="section soft">
            <div className="container">
              <div
                className="strategy-selection-summary"
                aria-live="polite"
              >
                <strong>{totalSelections}</strong>{" "}
                {totalSelections === 1
                  ? "strategy selected"
                  : "strategies selected"}
                {" · "}
                <strong>{totalPromptSelections}</strong>{" "}
                {totalPromptSelections === 1
                  ? "interview prompt selected"
                  : "interview prompts selected"}
              </div>

              <div className="outcome-layout">
                <div
                  className="outcome-navigation strategy-outcome-navigation"
                  role="tablist"
                  aria-label="Outcomes for evaluation strategies"
                >
                  {OUTCOMES.map((outcome, index) => {
                    const selectionCount =
                      getOutcomeSelectionCount(outcome.id);

                    return (
                      <button
                        key={outcome.id}
                        id={`strategy-outcome-tab-${outcome.id}`}
                        className="outcome-button"
                        type="button"
                        role="tab"
                        aria-selected={
                          selectedOutcome.id === outcome.id
                        }
                        aria-controls="strategy-outcome-detail-panel"
                        tabIndex={
                          selectedOutcome.id === outcome.id ? 0 : -1
                        }
                        onClick={() => selectOutcome(outcome.id)}
                        onKeyDown={(event) =>
                          handleOutcomeKeyDown(event, index)
                        }
                      >
                        <span>{outcome.name}</span>
                        {selectionCount > 0 && (
                          <span
                            className="outcome-selection-count"
                            aria-label={`${selectionCount} selected`}
                          >
                            {selectionCount}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>

                <article
                  id="strategy-outcome-detail-panel"
                  className="outcome-detail"
                  role="tabpanel"
                  aria-live="polite"
                  aria-labelledby={`strategy-outcome-tab-${selectedOutcome.id}`}
                >
                  <div className="eyebrow">
                    {selectedOutcome.name}
                  </div>

                  <h2>
                    Evaluation strategies for {selectedOutcome.name}
                  </h2>

                  {EVALUATION_STRATEGY_GROUPS.map((group) => {
                    const strategies = group.strategies.filter(
                      (strategy) =>
                        strategy.outcomeId === selectedOutcome.id
                    );
                    const includesInterview =
                      group.id === "qualitative";
                    const availableStrategyCount =
                      strategies.length + (includesInterview ? 1 : 0);
                    const selectedInGroup = new Set(
                      selectedForOutcome[group.id] || []
                    );

                    return (
                      <section
                        className="strategy-outcome-group"
                        aria-labelledby={`${selectedOutcome.id}-${group.id}-strategies-title`}
                        key={group.id}
                      >
                        <div className="strategy-category-header">
                          <h3
                            id={`${selectedOutcome.id}-${group.id}-strategies-title`}
                          >
                            {group.title}
                          </h3>

                          <div
                            className="strategy-category-count"
                            aria-live="polite"
                          >
                            {selectedInGroup.size} of{" "}
                            {availableStrategyCount} selected
                          </div>
                        </div>

                        {availableStrategyCount > 0 ? (
                          <div className="strategy-list">
                            {includesInterview && (
                              <InterviewStrategyRow
                                outcomeId={selectedOutcome.id}
                                isSelected={selectedInGroup.has(
                                  INTERVIEW_STRATEGY.id
                                )}
                                selectedPromptIds={promptsForOutcome}
                                note={
                                  notesForOutcome[
                                    INTERVIEW_STRATEGY.id
                                  ] || ""
                                }
                                onToggle={
                                  onToggleEvaluationStrategy
                                }
                                onTogglePrompt={
                                  onToggleInterviewPrompt
                                }
                                onUpdateNote={
                                  onUpdateEvaluationStrategyNote
                                }
                              />
                            )}

                            {strategies.map((strategy) => (
                              <EvaluationStrategyRow
                                key={strategy.id}
                                strategy={strategy}
                                outcomeId={selectedOutcome.id}
                                groupId={group.id}
                                isSelected={selectedInGroup.has(
                                  strategy.id
                                )}
                                note={
                                  notesForOutcome[strategy.id] || ""
                                }
                                onToggle={
                                  onToggleEvaluationStrategy
                                }
                                onUpdateNote={
                                  onUpdateEvaluationStrategyNote
                                }
                              />
                            ))}
                          </div>
                        ) : (
                          <div className="strategy-empty-state">
                            No {group.id} strategies were listed for
                            this outcome in the Round 2 prototype.
                          </div>
                        )}
                      </section>
                    );
                  })}
                </article>
              </div>

              <CaseExampleEvidenceSection variant="evaluation-strategies" />

              <ReflectionSection
                titleId="evaluation-strategies-reflection-title"
                title="Reflect on your evaluation strategies priorities"
                prompts={EVALUATION_STRATEGY_REFLECTION}
                note={reflectionNote}
                onChangeNote={onChangeReflectionNote}
              />

              <div className="next-step interest-next-step">
                <div>
                  <h2>Continue when your starting evaluation-strategy set feels useful</h2>
                  <p>
                    Your evaluation-strategy selections will carry forward to Develop Your
                    Evaluation Plan, where you can review and refine them as your
                    project and evaluation plan develop.
                  </p>
                </div>

                <PageLink route="final-plan">
                  Develop Your Evaluation Plan
                  <span aria-hidden="true">→</span>
                </PageLink>
              </div>
            </div>
          </section>
        </>
      );
    }

    function CustomInterviewPromptForm({ outcomeId, onAdd }) {
      const [topic, setTopic] = useState("");
      const [question, setQuestion] = useState("");

      function handleSubmit(event) {
        event.preventDefault();
        const trimmedQuestion = question.trim();
        if (!trimmedQuestion) return;
        onAdd(outcomeId, topic.trim(), trimmedQuestion);
        setTopic("");
        setQuestion("");
      }

      return (
        <form className="plan-custom-prompt-form" onSubmit={handleSubmit}>
          <label>
            <span>Topic / focus <em>(optional)</em></span>
            <input
              type="text"
              value={topic}
              placeholder="e.g., Workflow fit"
              onChange={(event) => setTopic(event.target.value)}
            />
          </label>
          <label>
            <span>Custom interview prompt</span>
            <textarea
              value={question}
              placeholder="Add a project-specific interview question."
              onChange={(event) => setQuestion(event.target.value)}
            />
          </label>
          <button className="button secondary" type="submit">
            Add prompt
          </button>
        </form>
      );
    }

    function PlanInterviewStrategyCard({
      outcomeId,
      isSelected,
      selectedPromptIds,
      customPrompts,
      note,
      onToggleStrategy,
      onTogglePrompt,
      onAddCustomPrompt,
      onRemoveCustomPrompt,
      onUpdateNote,
    }) {
      const prompts = INTERVIEW_PROMPTS_BY_OUTCOME[outcomeId] || [];
      const selectedPromptSet = new Set(selectedPromptIds || []);

      const togglePrompt = (promptId) => {
        if (!isSelected && !selectedPromptSet.has(promptId)) {
          onToggleStrategy(outcomeId, "qualitative", INTERVIEW_STRATEGY.id);
        }
        onTogglePrompt(outcomeId, promptId);
      };

      const addCustomPrompt = (targetOutcomeId, title, question) => {
        if (!isSelected) {
          onToggleStrategy(outcomeId, "qualitative", INTERVIEW_STRATEGY.id);
        }
        onAddCustomPrompt(targetOutcomeId, title, question);
      };

      return (
        <article className={`plan-interview-card${isSelected ? " is-selected" : ""}`}>
          <button
            className="strategy-row-select-button"
            type="button"
            aria-pressed={isSelected}
            onClick={() =>
              onToggleStrategy(outcomeId, "qualitative", INTERVIEW_STRATEGY.id)
            }
          >
            <span className="selection-indicator" aria-hidden="true">✓</span>
            <span className="strategy-row-title">
              {INTERVIEW_STRATEGY.name}
              <CitationNumbers
                ids={INTERVIEW_STRATEGY.citations.map((citation) => citation.label)}
              />
            </span>
          </button>

          <p className="strategy-row-description">{INTERVIEW_STRATEGY.description}</p>

          <div className="plan-interview-prompts">
            <div className="interview-prompts-header">
              <h4>
                Interview prompts
                <CitationNumbers
                  ids={(INTERVIEW_PROMPT_CITATIONS_BY_OUTCOME[outcomeId] || []).map(
                    (citation) => citation.label
                  )}
                />
              </h4>
              <div className="strategy-category-count">
                {selectedPromptSet.size + (customPrompts?.length || 0)} selected
              </div>
            </div>

            <p className="plan-holder-context">
              All suggested prompts remain visible. Selecting a prompt will also include semi-structured interviews in this outcome plan.
            </p>

            <div className="interview-prompt-list">
              {prompts.map(([title, question], index) => {
                const promptId = `prompt-${index + 1}`;
                const isPromptSelected = selectedPromptSet.has(promptId);
                return (
                  <label
                    className={`interview-prompt-option${isPromptSelected ? " is-selected" : ""}`}
                    key={promptId}
                  >
                    <input
                      type="checkbox"
                      checked={isPromptSelected}
                      onChange={() => togglePrompt(promptId)}
                    />
                    <span>
                      <span className="interview-prompt-title">{title}</span>
                      <span className="interview-prompt-question">{question}</span>
                    </span>
                  </label>
                );
              })}
            </div>

            {customPrompts.length > 0 && (
              <div className="plan-selected-prompts">
                {customPrompts.map((prompt) => (
                  <div className="plan-prompt-card" key={prompt.id}>
                    <button
                      className="plan-prompt-remove"
                      type="button"
                      aria-label="Remove custom interview prompt"
                      onClick={() => onRemoveCustomPrompt(outcomeId, prompt.id)}
                    >
                      ✓
                    </button>
                    <div>
                      <strong>{prompt.title || "Project-specific prompt"}</strong>
                      <p>{prompt.question}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <details className="plan-add-panel">
              <summary>+ Add project-specific interview prompt</summary>
              <CustomInterviewPromptForm
                outcomeId={outcomeId}
                onAdd={addCustomPrompt}
              />
            </details>
          </div>

          <details className="custom-notes-editor">
            <summary>Add notes for this strategy</summary>
            <div className="custom-notes-fields one-column">
              <label className="custom-notes-field">
                <span>Project notes</span>
                <textarea
                  value={note || ""}
                  placeholder="Add context, adaptations, questions, or decisions for your evaluation plan."
                  onChange={(event) =>
                    onUpdateNote(outcomeId, INTERVIEW_STRATEGY.id, event.target.value)
                  }
                />
              </label>
            </div>
          </details>
        </article>
      );
    }

    function PlanPrintSummary({
      selectedOutcomes,
      interestHolderSelections,
      interestHolderDetails,
      customInterestHolderGroups,
      customInterestHolderSelections,
      evaluationStrategySelections,
      evaluationStrategyNotes,
      interviewPromptSelections,
      customInterviewPrompts,
      implementationOutcomesReflection,
      interestHoldersReflection,
      evaluationStrategiesReflection,
    }) {
      return (
        <div className="plan-print-only">
          <h1>Mid-Design Evaluation Plan</h1>
          <p>
            Working plan developed using the Mid-Design Evaluation Guide. Review and revise this document as the project develops.
          </p>

          {selectedOutcomes.length === 0 ? (
            <p>No implementation outcomes are currently included in this plan.</p>
          ) : (
            selectedOutcomes.map((outcome) => {
              const holderIds = interestHolderSelections[outcome.id] || [];
              const customHolderIds = new Set(customInterestHolderSelections[outcome.id] || []);
              const customHolders = customInterestHolderGroups.filter((group) => customHolderIds.has(group.id));
              const outcomeStrategySelections = evaluationStrategySelections[outcome.id] || {};
              const selectedInterviewPromptIds = new Set(interviewPromptSelections[outcome.id] || []);
              const customPrompts = customInterviewPrompts[outcome.id] || [];
              const interviewSelected = new Set(outcomeStrategySelections.qualitative || []).has(INTERVIEW_STRATEGY.id);

              return (
                <section className="plan-print-outcome" key={outcome.id}>
                  <h2>{outcome.name}</h2>
                  <p><CitationText text={outcome.definition} /></p>

                  <div className="plan-print-group">
                    <h3>Interest holders</h3>
                    {(holderIds.length > 0 || customHolders.length > 0) ? (
                      <ul>
                        {holderIds.map((id) => {
                          const group = INTEREST_HOLDER_GROUPS_BY_ID[id];
                          if (!group) return null;
                          const details = interestHolderDetails[outcome.id]?.[id] || {};
                          return (
                            <li key={id}>
                              <strong>{group.label}</strong>
                              {details.examples ? `, Examples: ${details.examples}` : ""}
                              {details.notes ? `, Notes: ${details.notes}` : ""}
                            </li>
                          );
                        })}
                        {customHolders.map((group) => (
                          <li key={group.id}>
                            <strong>{group.name}</strong>{group.note ? `, ${group.note}` : ""}
                          </li>
                        ))}
                      </ul>
                    ) : <p>None selected.</p>}
                  </div>

                  {EVALUATION_STRATEGY_GROUPS.map((strategyGroup) => {
                    const selectedIds = new Set(outcomeStrategySelections[strategyGroup.id] || []);
                    const strategies = strategyGroup.strategies.filter((strategy) =>
                      strategy.outcomeId === outcome.id && selectedIds.has(strategy.id)
                    );
                    const includeInterview = strategyGroup.id === "qualitative" && interviewSelected;
                    if (strategies.length === 0 && !includeInterview) return null;

                    return (
                      <div className="plan-print-group" key={strategyGroup.id}>
                        <h3>{strategyGroup.title}</h3>
                        <ul>
                          {includeInterview && (
                            <li>
                              <strong>{INTERVIEW_STRATEGY.name}</strong>
                              {evaluationStrategyNotes[outcome.id]?.[INTERVIEW_STRATEGY.id]
                                ? `, Notes: ${evaluationStrategyNotes[outcome.id][INTERVIEW_STRATEGY.id]}`
                                : ""}
                              {(selectedInterviewPromptIds.size > 0 || customPrompts.length > 0) && (
                                <ul>
                                  {(INTERVIEW_PROMPTS_BY_OUTCOME[outcome.id] || []).map(([title, question], index) => {
                                    const promptId = `prompt-${index + 1}`;
                                    if (!selectedInterviewPromptIds.has(promptId)) return null;
                                    return <li key={promptId}><strong>{title}:</strong> {question}</li>;
                                  })}
                                  {customPrompts.map((prompt) => (
                                    <li key={prompt.id}><strong>{prompt.title || "Project-specific prompt"}:</strong> {prompt.question}</li>
                                  ))}
                                </ul>
                              )}
                            </li>
                          )}
                          {strategies.map((strategy) => (
                            <li key={strategy.id}>
                              <strong>{strategy.name}</strong>
                              {evaluationStrategyNotes[outcome.id]?.[strategy.id]
                                ? `, Notes: ${evaluationStrategyNotes[outcome.id][strategy.id]}`
                                : ""}
                            </li>
                          ))}
                        </ul>
                      </div>
                    );
                  })}
                </section>
              );
            })
          )}

          <section className="plan-print-outcome">
            <h2>Reflection &amp; Remaining Questions</h2>
            <div className="plan-print-group">
              <h3>Implementation Outcomes</h3>

                {implementationOutcomesReflection || "No reflection recorded."}
              </p>
            </div>
            <div className="plan-print-group">
              <h3>Interest Holders</h3>
              <p>{interestHoldersReflection || "No reflection recorded."}</p>
            </div>
            <div className="plan-print-group">
              <h3>Evaluation Strategies</h3>
              <p>
                {evaluationStrategiesReflection || "No reflection recorded."}
              </p>
            </div>
          </section>
        </div>
      );
    }

    function DevelopEvaluationPlanPage({
      implementationOutcomeSelections,
      onToggleImplementationOutcome,
      interestHolderSelections,
      onToggleInterestHolder,
      interestHolderDetails,
      onUpdateInterestHolderDetail,
      customInterestHolderGroups,
      customInterestHolderSelections,
      onAddCustomInterestHolder,
      onToggleCustomInterestHolder,
      onRemoveCustomInterestHolder,
      evaluationStrategySelections,
      onToggleEvaluationStrategy,
      evaluationStrategyNotes,
      onUpdateEvaluationStrategyNote,
      interviewPromptSelections,
      onToggleInterviewPrompt,
      customInterviewPrompts,
      onAddCustomInterviewPrompt,
      onRemoveCustomInterviewPrompt,
      implementationOutcomesReflection,
      interestHoldersReflection,
      evaluationStrategiesReflection,
    }) {
      const selectedOutcomeSet = new Set(implementationOutcomeSelections);
      const selectedOutcomes = OUTCOMES.filter((outcome) => selectedOutcomeSet.has(outcome.id));
      const [activeOutcomeId, setActiveOutcomeId] = useState(
        selectedOutcomes[0]?.id || OUTCOMES[0].id
      );

      const activeOutcome =
        OUTCOMES.find((outcome) => outcome.id === activeOutcomeId) ||
        OUTCOMES[0];

      function ensureOutcomeIncluded(outcomeId) {
        if (!implementationOutcomeSelections.includes(outcomeId)) {
          onToggleImplementationOutcome(outcomeId);
        }
      }

      function handleBuilderToggleInterestHolder(outcomeId, roleId) {
        const isCurrentlySelected = (
          interestHolderSelections[outcomeId] || []
        ).includes(roleId);

        if (!isCurrentlySelected) {
          ensureOutcomeIncluded(outcomeId);
        }

        onToggleInterestHolder(outcomeId, roleId);
      }

      function handleBuilderAddCustomInterestHolder(
        outcomeId,
        name,
        note
      ) {
        ensureOutcomeIncluded(outcomeId);
        onAddCustomInterestHolder(outcomeId, name, note);
      }

      function handleBuilderToggleCustomInterestHolder(
        outcomeId,
        customId
      ) {
        const isCurrentlySelected = (
          customInterestHolderSelections[outcomeId] || []
        ).includes(customId);

        if (!isCurrentlySelected) {
          ensureOutcomeIncluded(outcomeId);
        }

        onToggleCustomInterestHolder(outcomeId, customId);
      }

      function handleBuilderToggleEvaluationStrategy(
        outcomeId,
        groupId,
        strategyId
      ) {
        const isCurrentlySelected = (
          evaluationStrategySelections[outcomeId]?.[groupId] || []
        ).includes(strategyId);

        if (!isCurrentlySelected) {
          ensureOutcomeIncluded(outcomeId);
        }

        onToggleEvaluationStrategy(outcomeId, groupId, strategyId);
      }

      function handleBuilderToggleInterviewPrompt(outcomeId, promptId) {
        const isCurrentlySelected = (
          interviewPromptSelections[outcomeId] || []
        ).includes(promptId);
        const interviewIsAlreadySelected = (
          evaluationStrategySelections[outcomeId]?.qualitative || []
        ).includes(INTERVIEW_STRATEGY.id);

        // If the interview strategy is not already selected, the interview card
        // will select it first, and that strategy selection will include the outcome.
        if (!isCurrentlySelected && interviewIsAlreadySelected) {
          ensureOutcomeIncluded(outcomeId);
        }

        onToggleInterviewPrompt(outcomeId, promptId);
      }

      function handleBuilderAddCustomInterviewPrompt(
        outcomeId,
        title,
        question
      ) {
        const interviewIsAlreadySelected = (
          evaluationStrategySelections[outcomeId]?.qualitative || []
        ).includes(INTERVIEW_STRATEGY.id);

        // When interviews are not yet selected, PlanInterviewStrategyCard selects
        // that strategy before adding the custom prompt, which also includes the outcome.
        if (interviewIsAlreadySelected) {
          ensureOutcomeIncluded(outcomeId);
        }

        onAddCustomInterviewPrompt(outcomeId, title, question);
      }

      function handleExport() {
        const lines = [
          "MID-DESIGN EVALUATION PLAN",
          "",
          "Working plan developed using the Mid-Design Evaluation Guide.",
          "",
        ];

        if (selectedOutcomes.length === 0) {
          lines.push("No implementation outcomes are currently included in this plan.");
        }

        selectedOutcomes.forEach((outcome) => {
          lines.push(outcome.name.toUpperCase());
          lines.push(outcome.definition.text || outcome.definition);
          lines.push("");

          lines.push("Interest holders");
          const holderIds = interestHolderSelections[outcome.id] || [];
          const customHolderIds = new Set(customInterestHolderSelections[outcome.id] || []);
          const customHolders = customInterestHolderGroups.filter((group) => customHolderIds.has(group.id));
          if (holderIds.length === 0 && customHolders.length === 0) {
            lines.push("- None selected");
          } else {
            holderIds.forEach((id) => {
              const group = INTEREST_HOLDER_GROUPS_BY_ID[id];
              if (!group) return;
              const details = interestHolderDetails[outcome.id]?.[id] || {};
              lines.push(`- ${group.label}`);
              if (details.examples) lines.push(`  Project examples: ${details.examples}`);
              if (details.notes) lines.push(`  Notes: ${details.notes}`);
            });
            customHolders.forEach((group) => {
              lines.push(`- ${group.name}${group.note ? `, ${group.note}` : ""}`);
            });
          }
          lines.push("");

          const outcomeStrategySelections = evaluationStrategySelections[outcome.id] || {};
          EVALUATION_STRATEGY_GROUPS.forEach((strategyGroup) => {
            const selectedIds = new Set(outcomeStrategySelections[strategyGroup.id] || []);
            const strategies = strategyGroup.strategies.filter(
              (strategy) => strategy.outcomeId === outcome.id && selectedIds.has(strategy.id)
            );
            const interviewSelected =
              strategyGroup.id === "qualitative" && selectedIds.has(INTERVIEW_STRATEGY.id);
            if (strategies.length === 0 && !interviewSelected) return;

            lines.push(strategyGroup.title);
            if (interviewSelected) {
              lines.push(`- ${INTERVIEW_STRATEGY.name}`);
              const interviewNote = evaluationStrategyNotes[outcome.id]?.[INTERVIEW_STRATEGY.id];
              if (interviewNote) lines.push(`  Notes: ${interviewNote}`);
              const selectedPromptIds = new Set(interviewPromptSelections[outcome.id] || []);
              (INTERVIEW_PROMPTS_BY_OUTCOME[outcome.id] || []).forEach(([title, question], index) => {
                const promptId = `prompt-${index + 1}`;
                if (selectedPromptIds.has(promptId)) {
                  lines.push(`  • ${title}: ${question}`);
                }
              });
              (customInterviewPrompts[outcome.id] || []).forEach((prompt) => {
                lines.push(`  • ${prompt.title || "Project-specific prompt"}: ${prompt.question}`);
              });
            }
            strategies.forEach((strategy) => {
              lines.push(`- ${strategy.name}`);
              const note = evaluationStrategyNotes[outcome.id]?.[strategy.id];
              if (note) lines.push(`  Notes: ${note}`);
            });
            lines.push("");
          });
          lines.push("------------------------------------------------------------", "");
        });

        lines.push("REFLECTION & REMAINING QUESTIONS", "");
        lines.push("Implementation Outcomes");
        lines.push(implementationOutcomesReflection || "No reflection recorded.");
        lines.push("");
        lines.push("Interest Holders");
        lines.push(interestHoldersReflection || "No reflection recorded.");
        lines.push("");
        lines.push("Evaluation Strategies");
        lines.push(evaluationStrategiesReflection || "No reflection recorded.");
        lines.push("");

        const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "mid-design-evaluation-plan.txt";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      return (
        <div className="develop-plan-page">
          <section
            className="hero compact develop-plan-fullscreen-hero"
            aria-labelledby="develop-plan-page-title"
          >
            <div className="container">
              <div className="eyebrow">Guide Step 4</div>
              <h1 id="develop-plan-page-title">Develop Your Evaluation Plan</h1>

              <p className="lede">
                <em>The Evaluation Plan Builder</em> brings together the implementation outcomes,
                interest holders, and evaluation strategies you selected throughout the guide.
                Use this workspace to review your selections, make changes, and{" "}
                <strong><code className="term-code">tailor your evaluation plan to your project context</code></strong>.
              </p>

              <p className="develop-plan-intro-detail">
                Your plan is intended to be a <strong>working document</strong>, not a fixed endpoint.
                You can continue refining it as your design develops, use it to support team discussion
                and evaluation planning, and print or export a copy for future use and revision.
              </p>

              <p className="develop-plan-intro-instruction">
                Review your plan by implementation outcome and refine the interest holders and evaluation
                strategies you may want to carry forward.
              </p>

              <button
                className="scroll-prompt"
                type="button"
                onClick={() =>
                  document
                    .getElementById("evaluation-plan-builder-content")
                    ?.scrollIntoView({ behavior: "smooth", block: "start" })
                }
              >
                Develop Your Evaluation Plan
                <span className="scroll-arrow" aria-hidden="true">↓</span>
              </button>
            </div>
          </section>

          <section id="evaluation-plan-builder-content" className="section soft plan-builder-section">
            <div className="container">
              <div className="plan-workspace-screen">
                <div className="plan-toolbar">
                  <div>
                    <h2>Your working evaluation plan</h2>
                    <p>
                      {selectedOutcomes.length} of {OUTCOMES.length} implementation outcomes currently included.
                    </p>
                    <p className="plan-session-note">
                      Session note: selections are not saved automatically across sessions. Print or export a copy before leaving the guide.
                    </p>
                  </div>
                  <div className="plan-toolbar-actions">
                    <button className="button secondary" type="button" onClick={() => window.print()}>
                      Print / Save as PDF
                    </button>
                    <button className="button" type="button" onClick={handleExport}>
                      Export plan (.txt)
                    </button>
                  </div>
                </div>

                <section className="plan-outcome-selector" aria-labelledby="plan-outcomes-title">
                  <div className="plan-outcome-selector-header">
                    <div>
                      <h3 id="plan-outcomes-title">Implementation outcomes in your plan</h3>
                      <p>
                        Outcomes you marked as relevant are included by default. Selecting an interest holder or evaluation strategy below will also include its implementation outcome automatically.
                      </p>
                    </div>
                  </div>
                  <div className="plan-outcome-options">
                    {OUTCOMES.map((outcome) => {
                      const isSelected = selectedOutcomeSet.has(outcome.id);
                      return (
                        <button
                          className={`plan-outcome-option${isSelected ? " is-selected" : ""}`}
                          type="button"
                          aria-pressed={isSelected}
                          key={outcome.id}
                          onClick={() => {

                        >
                          <span className="plan-mini-check" aria-hidden="true">✓</span>

                </section>

                <div className="plan-option-legend">
                  <strong>All available options remain visible in the Builder.</strong>{" "}
                  Items already included in your plan are highlighted. Unselected items appear in a quieter gray treatment and can be selected at any time.
                </div>

                <div className="plan-builder-layout">
                  <aside className="plan-builder-sidebar" aria-label="Implementation outcomes">
                    <div className="plan-builder-sidebar-label">Review plan by outcome</div>
                    {OUTCOMES.map((outcome) => {
                      const isIncluded = selectedOutcomeSet.has(outcome.id);
                      return (
                        <button
                          className={`plan-outcome-nav-button${activeOutcome?.id === outcome.id ? " is-active" : ""}`}
                          type="button"
                          key={outcome.id}
                          onClick={() => setActiveOutcomeId(outcome.id)}
                        >
                          <span>{outcome.name}</span>
                          <span

                          >
                            {isIncluded ? "✓" : "○"}
                          </span>
                        </button>
                      );
                    })}
                  </aside>

                  {activeOutcome && (() => {
                    const selectedHolderIds = interestHolderSelections[activeOutcome.id] || [];
                    const selectedHolderSet = new Set(selectedHolderIds);
                    const recommendationIds = new Set(
                      (OUTCOME_INTEREST_HOLDER_RECOMMENDATIONS[activeOutcome.id] || []).map((item) => item.groupId)
                    );
                    const allHolderGroups = Object.values(INTEREST_HOLDER_GROUPS_BY_ID);
                    const outcomeStrategySelections = evaluationStrategySelections[activeOutcome.id] || {};

                    return (
                      <article className="plan-workspace-card">
                        <header className="plan-workspace-heading">
                          <div className="eyebrow">Implementation outcome</div>
                          <h2>{activeOutcome.name}</h2>
                          <p><CitationText text={activeOutcome.definition} /></p>
                        </header>

                        <section className="plan-content-section" aria-labelledby={`plan-holders-${activeOutcome.id}`}>
                          <div className="plan-section-heading">
                            <h3 id={`plan-holders-${activeOutcome.id}`}>Interest holders</h3>
                            <p>
                              Review the full legitimate-interest scaffold for this outcome. Groups already selected are highlighted; the remaining groups stay visible so you can add them if they become relevant to your project.
                            </p>
                          </div>

                          <div className="plan-all-options-grid">
                            {allHolderGroups.map((group) => (
                              <PlanInterestHolderCard
                                key={group.id}
                                outcomeId={activeOutcome.id}
                                group={group}
                                isSelected={selectedHolderSet.has(group.id)}
                                isRecommended={recommendationIds.has(group.id)}
                                details={interestHolderDetails[activeOutcome.id]?.[group.id] || {}}
                                onToggle={handleBuilderToggleInterestHolder}
                                onUpdateDetail={onUpdateInterestHolderDetail}
                              />
                            ))}
                          </div>

                          <CustomInterestHolderPanel
                            activeOutcome={activeOutcome}
                            customGroups={customInterestHolderGroups}
                            customSelections={customInterestHolderSelections}
                            onAddCustomGroup={handleBuilderAddCustomInterestHolder}
                            onToggleCustomGroup={handleBuilderToggleCustomInterestHolder}
                            onRemoveCustomGroup={onRemoveCustomInterestHolder}
                          />
                        </section>

                        <section className="plan-content-section" aria-labelledby={`plan-strategies-${activeOutcome.id}`}>
                          <div className="plan-section-heading">
                            <h3 id={`plan-strategies-${activeOutcome.id}`}>Evaluation strategies</h3>
                            <p>

                          {EVALUATION_STRATEGY_GROUPS.map((strategyGroup) => {

                            const availableStrategies = strategyGroup.strategies.filter(
                              (strategy) => strategy.outcomeId === activeOutcome.id
                            );
                            const interviewSelected =
                              strategyGroup.id === "qualitative" && selectedIds.has(INTERVIEW_STRATEGY.id);

                            return (
                              <div className="plan-strategy-category" key={strategyGroup.id}>
                                <div className="plan-strategy-category-header">
                                  <h4>{strategyGroup.title}</h4>
                                  <span>
                                    {availableStrategies.filter((strategy) => selectedIds.has(strategy.id)).length + (interviewSelected ? 1 : 0)} selected
                                  </span>
                                </div>

                                <div className="plan-selected-list">
                                  {strategyGroup.id === "qualitative" && (
                                    <PlanInterviewStrategyCard
                                      outcomeId={activeOutcome.id}
                                      isSelected={interviewSelected}
                                      selectedPromptIds={interviewPromptSelections[activeOutcome.id] || []}
                                      customPrompts={customInterviewPrompts[activeOutcome.id] || []}
                                      note={evaluationStrategyNotes[activeOutcome.id]?.[INTERVIEW_STRATEGY.id] || ""}
                                      onToggleStrategy={handleBuilderToggleEvaluationStrategy}
                                      onTogglePrompt={handleBuilderToggleInterviewPrompt}
                                      onAddCustomPrompt={handleBuilderAddCustomInterviewPrompt}
                                      onRemoveCustomPrompt={onRemoveCustomInterviewPrompt}
                                      onUpdateNote={onUpdateEvaluationStrategyNote}
                                    />

                                  {availableStrategies.map((strategy) => (
                                    <EvaluationStrategyRow
                                      key={strategy.id}
                                      strategy={strategy}
                                      outcomeId={activeOutcome.id}
                                      groupId={strategyGroup.id}
                                      isSelected={selectedIds.has(strategy.id)}
                                      note={evaluationStrategyNotes[activeOutcome.id]?.[strategy.id] || ""}
                                      onToggle={handleBuilderToggleEvaluationStrategy}
                                      onUpdateNote={onUpdateEvaluationStrategyNote}

                                  {availableStrategies.length === 0 && strategyGroup.id !== "qualitative" && (

                                  )}
                                </div>
                              </div>
                            );
                          })}

                      </article>

                <section

                  <h3 id="plan-reflection-summary-title">

                      <p>
