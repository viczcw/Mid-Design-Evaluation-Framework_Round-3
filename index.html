<!DOCTYPE html>
<!--
  Current prototype summary:
  - Expanded the guide from four routes to six: Start Here, Discover Implementation
    Outcomes, Discover Interest Holders, Discover Evaluation Strategies, Develop
    Your Evaluation Plan, and Resources.
  - Updated the primary navigation, hash routing, application page selection, and
    Start Here workflow to match the new four-step evaluation-planning sequence.
  - Refined Discover Interest Holders with a concise source-bounded definition,
    a legitimate-interest scaffold, reflection prompts, outcome-specific selections,
    and editable project examples and notes.
  - Added full-width, selectable, outcome-specific evaluation strategies from the
    Round 2 prototype, including author-year article links, available instruments,
    supporting visuals, editable notes, and selectable interview prompts.
  - Added explicit implementation-outcome relevance selection, separate from the
    currently reviewed outcome, with shared session state and sidebar status marks.
  - Added continuation links across the guide and a working Evaluation Plan Builder;
    selections persist in shared session state.
  - The plan builder now supports review and refinement by implementation outcome,
    project-specific additions, interview-prompt customization, and print/export.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="A guide for considering implementation outcomes and planning evaluation during mid-design."
  />

  <title>Mid-Design Evaluation Guide</title>

  <!-- Preserves the existing Round 2 React/Babel approach. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --ink: #17282f;
      --ink-soft: #465d67;
      --muted: #667982;
      --line: #d7e1e4;
      --line-strong: #bacbd0;
      --white: #ffffff;
      --surface: #f4f8f8;
      --accent-soft: #e1eff0;
      --accent: #176c74;
      --accent-dark: #0e5057;
      --notice: #f6f3e8;
      --notice-line: #c8b96f;
      --shadow: 0 14px 34px rgba(24, 52, 61, 0.08);
      --radius: 14px;
      --radius-large: 20px;
      --content-width: 1120px;
      --reading-width: 780px;
      --page-gutter: clamp(28px, 6vw, 112px);
      --layout-width: 1472px;
      --header-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 90.625%;
      scroll-behavior: smooth;
      scroll-padding-top: var(--header-height);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 14.5px;
      line-height: 1.62;
    }

    body,
    #root {
      min-height: 100vh;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--accent-dark);
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(23, 108, 116, 0.35);
      outline-offset: 3px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.18;
      letter-spacing: -0.025em;
    }

    h1 {
      max-width: 880px;
      margin-bottom: 22px;
      font-size: clamp(2.35rem, 6vw, 4.5rem);
    }

    h2 {
      margin-bottom: 16px;
      font-size: clamp(1.75rem, 3.6vw, 2.55rem);
    }

    h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 10px 14px;
      color: white;
      background: var(--accent-dark);
      border-radius: 8px;
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .container {
      width: 100%;
      max-width: var(--layout-width);
      margin: 0 auto;
      padding-inline: var(--page-gutter);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .nav-shell {
      width: 100%;
      max-width: var(--layout-width);
      min-height: 72px;
      margin: 0 auto;
      padding-inline: var(--page-gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 750;
      line-height: 1.25;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: white;
      background: var(--accent);
      border-radius: 50%;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .desktop-navigation {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .navigation-link {
      min-height: 44px;
      padding: 10px 13px;
      display: inline-flex;
      align-items: center;
      color: var(--ink-soft);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.91rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .navigation-link:hover {
      color: var(--accent-dark);
      background: var(--surface);
    }

    .navigation-link[aria-current="page"] {
      color: var(--accent-dark);
      background: var(--accent-soft);
    }

    .menu-button {
      width: 46px;
      height: 46px;
      display: none;
      place-items: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      cursor: pointer;
    }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      width: 20px;
      height: 2px;
      display: block;
      background: var(--ink);
      border-radius: 2px;
      transition: 160ms ease;
    }

    .menu-icon {
      position: relative;
    }

    .menu-icon::before,
    .menu-icon::after {
      position: absolute;
      left: 0;
      content: "";
    }

    .menu-icon::before {
      top: -6px;
    }

    .menu-icon::after {
      top: 6px;
    }

    .menu-button[aria-expanded="true"] .menu-icon {
      background: transparent;
    }

    .menu-button[aria-expanded="true"] .menu-icon::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button[aria-expanded="true"] .menu-icon::after {
      top: 0;
      transform: rotate(-45deg);
    }

    .mobile-navigation {
      display: none;
      padding: 0 20px 18px;
      background: white;
      border-top: 1px solid var(--line);
    }

    .mobile-navigation.open {
      display: grid;
      gap: 4px;
    }

    main {
      min-height: calc(100vh - 180px);
    }

    .hero {
      padding: clamp(60px, 9vw, 108px) 0 clamp(52px, 7vw, 84px);
      background: linear-gradient(180deg, #f3f8f8 0%, white 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero.compact {
      padding: clamp(52px, 7vw, 80px) 0;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--accent-dark);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .lede {
      max-width: 830px;
      margin-bottom: 20px;
      color: var(--ink-soft);
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      line-height: 1.55;
    }

    .definition {
      max-width: 790px;
      margin: 28px 0 0;
      padding-left: 18px;
      color: var(--ink-soft);
      border-left: 4px solid var(--accent);
    }

    .definition strong {
      color: var(--ink);
    }

    .section {
      padding: clamp(64px, 8vw, 100px) 0;
    }

    .section.soft {
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .section-heading {
      max-width: var(--reading-width);
      margin-bottom: 38px;
    }

    .section-heading p {
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 1.05rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      min-height: 48px;
      padding: 11px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 750;
      cursor: pointer;
      transition:
        background 140ms ease,
        border-color 140ms ease,
        transform 140ms ease;
    }

    .button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .button.secondary {
      color: var(--accent-dark);
      background: white;
      border-color: var(--line-strong);
    }

    .button.secondary:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .button:disabled {
      color: var(--muted);
      background: #edf2f3;
      border-color: var(--line);
      cursor: not-allowed;
      transform: none;
    }

    .step-flow {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 18px;
    }

    .instruction-overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(34px, 3.5vw, 52px);
      align-items: stretch;
    }

    .instruction-overview-card {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
    }

    .instruction-overview-card:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: clamp(-36px, -2.4vw, -23px);
      color: var(--accent);
      content: "→";
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
      transform: translateY(-50%);
    }

    .instruction-overview-card p {
      margin-bottom: 22px;
      color: var(--ink-soft);
    }

    .instruction-overview-card .button {
      width: 100%;
      margin-top: auto;
    }

    .step-card {
      padding: clamp(25px, 4vw, 38px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .step-card-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 0.8fr)
        minmax(360px, 1.2fr);
      gap: clamp(28px, 5vw, 66px);
      align-items: start;
    }

    .step-card-copy {
      min-width: 0;
    }

    .step-number {
      width: fit-content;
      margin-bottom: 18px;
      padding: 5px 10px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .step-detail {
      min-width: 0;
      padding: clamp(18px, 2.5vw, 26px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .step-detail-label {
      margin-bottom: 10px;
      color: var(--accent-dark);
      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .step-detail h4 {
      margin: 0 0 9px;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.3;
    }

    .step-detail > p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .step-detail sup {
      margin-left: 2px;
      font-size: 0.72em;
      vertical-align: super;
    }

    .step-workflow {
      display: grid;
      gap: 0;
    }

    .step-workflow-node {
      padding: 15px 16px;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
    }

    .step-workflow-node strong {
      display: block;
      color: var(--ink);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .step-workflow-node p {
      color: var(--ink-soft);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .step-workflow-arrow {
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
    }

    /* Step 4: final-plan guidance reuses the existing step-detail visual system
       without repeating the Outcome → Who → How flow. */
    .final-plan-guidance {
      gap: 10px;
    }

    .final-plan-guidance-block {
      display: block;
      text-align: left;
    }

    .final-plan-guidance-block p {
      margin: 6px 0 0;
    }

    .final-plan-guidance-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .step-card p,
    .resource-card p,
    .builder-column > p {
      color: var(--ink-soft);
    }

    .preview-list {
      margin: 20px 0 25px;
      padding: 18px 0 0 20px;
      border-top: 1px solid var(--line);
    }

    .preview-list li {
      margin: 7px 0;
      color: var(--ink-soft);
    }

    .flow-arrow {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      text-decoration: none;
      font-size: 1.45rem;
      line-height: 1;
      transition:
        color 140ms ease,
        background 140ms ease,
        border-color 140ms ease,
        transform 140ms ease;
    }

    .flow-arrow:hover {
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(2px);
    }

    .section-jump {
      width: fit-content;
      min-height: 40px;
      margin: 18px auto 0;
      padding: 7px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-dark);
      border-bottom: 1px solid transparent;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .section-jump:hover {
      border-bottom-color: var(--accent);
    }

    .section-jump-icon {
      font-size: 1rem;
      transition: transform 140ms ease;
    }

    .section-jump:hover .section-jump-icon {
      transform: translateY(2px);
    }

    .shortcut {
      margin-top: 24px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .shortcut p {
      margin: 0;
      color: var(--ink-soft);
    }

    .text-link {
      flex: 0 0 auto;
      color: var(--accent-dark);
      font-weight: 750;
      text-underline-offset: 3px;
    }

    .reasoning-model {
      display: grid;
      grid-template-columns: repeat(5, auto);
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 28px);
      margin: 44px 0 32px;
    }

    .reasoning-node {
      width: clamp(150px, 20vw, 230px);
      min-height: 170px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
    }

    .reasoning-node span {
      margin-bottom: 12px;
      color: var(--accent-dark);
      font-size: 0.8rem;
      font-weight: 850;
      letter-spacing: 0.1em;
    }

    .reasoning-node p {
      margin: 0;
      font-weight: 680;
      line-height: 1.42;
    }

    .relationship-symbol {
      color: var(--accent);
      font-size: 1.7rem;
    }

    .rationale {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 22px;
      background: var(--accent-soft);
      border-radius: var(--radius);
    }

    .rationale strong {
      display: block;
      margin-bottom: 8px;
    }

    .rationale ul {
      margin: 0;
      padding-left: 20px;
      color: var(--ink-soft);
    }

    .builder-explanation {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: clamp(34px, 6vw, 80px);
      align-items: center;
    }

    .builder-explanation p {
      color: var(--ink-soft);
    }

    .connection-stack {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .connection-node {
      min-height: 76px;
      padding: 16px 18px;
      display: grid;
      place-items: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      text-align: center;
      font-weight: 750;
    }

    .connection-line {
      height: 35px;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
    }

    .important-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 20px;
      align-items: start;
    }

    .information-panel {
      padding: 26px;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .information-panel p:last-child {
      margin-bottom: 0;
    }

    .session-notice {
      background: var(--notice);
      border-color: var(--notice-line);
    }

    .session-notice .eyebrow {
      color: #6d6026;
    }

    .next-step {
      padding: clamp(28px, 5vw, 44px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      color: white;
      background: var(--accent-dark);
      border-radius: var(--radius-large);
    }

    .next-step h2 {
      margin-bottom: 10px;
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    .next-step p {
      max-width: 680px;
      margin-bottom: 0;
      color: #dcebed;
    }

    .next-step .button {
      flex: 0 0 auto;
      color: var(--accent-dark);
      background: white;
      border-color: white;
    }

    .outcome-layout {
      display: grid;
      grid-template-columns: minmax(180px, 0.27fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .outcomes-intro.hero.compact {
      padding-top: clamp(30px, 4vw, 44px);
      padding-bottom: clamp(24px, 3.2vw, 34px);
    }

    .outcomes-intro .eyebrow {
      margin-bottom: 8px;
    }

    .outcomes-intro h1 {
      margin-bottom: 12px;
    }

    .outcomes-intro .lede {
      margin-bottom: 0;
    }

    /* Match the Interest Holder page's full-screen conceptual introduction. */
    .outcomes-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    .outcomes-fullscreen-hero > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .outcomes-fullscreen-hero .lede {
      max-width: 980px;
      margin-bottom: 20px;
    }

    .outcome-intro-instruction {
      max-width: 900px;
      margin: 18px 0 0;
      color: var(--ink-soft);
      font-size: 1rem;
      line-height: 1.7;
    }

    .outcomes-scroll-prompt {
      cursor: pointer;
    }

    #implementation-outcomes-content {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    /* Match the conceptual-intro structure used on the Outcomes and Interest Holder pages. */
    .evaluation-strategies-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    .evaluation-strategies-fullscreen-hero > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .evaluation-strategies-fullscreen-hero .lede {
      max-width: 980px;
      margin-bottom: 18px;
    }

    .strategy-intro-detail,
    .strategy-intro-instruction {
      max-width: 980px;
      color: var(--ink-soft);
      line-height: 1.7;
    }

    .strategy-intro-detail {
      margin: 0 0 16px;
      font-size: 1rem;
    }

    .strategy-intro-instruction {
      margin: 18px 0 0;
      font-size: 1rem;
    }

    .evaluation-strategies-scroll-prompt {
      cursor: pointer;
    }

    #evaluation-strategies-content {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    .outcomes-content.section {
      padding-top: clamp(28px, 4vw, 44px);
    }

    @media (max-width: 640px) {
      .outcomes-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .outcomes-fullscreen-hero > .container,
      .evaluation-strategies-fullscreen-hero > .container {
        padding-inline: 20px;
      }

      .evaluation-strategies-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }


      .outcome-detail-header {
        display: grid;
        gap: 14px;
      }

      .outcome-interest-control {
        width: fit-content;
      }
    }

    .outcome-navigation {
      position: sticky;
      top: 94px;
      display: grid;
      gap: 8px;
    }

    .outcome-button {
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      color: var(--ink-soft);
      background: white;
      border: 1px solid var(--line);

      height: 1px;

    .outcome-interest-check {
      width: 22px;
      height: 22px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: transparent;
      background: white;
      border: 1.5px solid var(--line-strong);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 900;

    .outcome-detail {

      gap: 12px;
      margin-top: 13px;
    }

    .custom-notes-fields.one-column {
      grid-template-columns: minmax(0, 1fr);
    }

    .recommendation-custom-notes .custom-notes-fields {
      grid-template-columns: minmax(0, 1fr);
    }

    .custom-notes-field {
      min-width: 0;
    }

    .custom-notes-field > span {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 760;
    }

    .custom-notes-field textarea {
      width: 100%;
      min-height: 88px;
      padding: 10px 11px;
      resize: vertical;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .interview-strategy-row {
      border-left: 4px solid var(--accent);
    }

    .interview-prompts {
      margin: 18px 0 0 41px;
      padding: 17px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .interview-prompts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .interview-prompts-header h4 {
      margin: 0;
      font-size: 0.9rem;
    }

    .interview-prompt-list {
      display: grid;
      gap: 9px;
    }

    .interview-prompt-option {
      min-width: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
    }

    .interview-prompt-option.is-selected {
      background: #eef7f7;
      border-color: var(--accent);
    }

    .interview-prompt-option input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--accent);
    }

    .interview-prompt-title {
      display: block;
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 790;
    }

    .interview-prompt-question {
      display: block;
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 0.78rem;
      line-height: 1.48;
    }

    .strategy-empty-state {
      padding: 18px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      font-size: 0.86rem;
    }

    .builder-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .builder-column {
      min-width: 0;
      padding: 23px;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
    }

    .builder-column h2 {
      margin-bottom: 8px;
      font-size: 1.35rem;
    }

    .builder-column > p {
      min-height: 52px;
      font-size: 0.94rem;
    }

    .builder-label {
      margin-bottom: 12px;
      color: var(--accent-dark);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.1em;
    }

    .choice-placeholder {
      min-height: 74px;
      margin-top: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .relationship-note {
      margin: 24px 0 0;
      padding: 18px 20px;
      color: var(--ink-soft);
      background: var(--accent-soft);
      border-radius: var(--radius);
      text-align: center;
    }

    .plan-summary {
      padding: clamp(26px, 5vw, 42px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .empty-state {
      min-height: 180px;
      padding: 32px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      text-align: center;
    }

    .empty-state p {
      margin: 0;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .resource-card {
      min-height: 210px;
      padding: 27px;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .resource-card .placeholder-label {
      margin-top: 18px;
    }

    .guide-citation-notice .guide-citation-text {
      margin: 14px 0 16px;
      padding: 14px 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(109, 96, 38, 0.2);
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.58;
      overflow-wrap: anywhere;
    }

    .guide-citation-notice .guide-citation-text a {
      color: #5f5424;
      font-weight: 700;
      text-underline-offset: 3px;
    }

    .citation-copy-button {
      min-height: 40px;
      padding: 8px 13px;
      font-size: 0.8rem;
    }

    .footer-credit strong {
      color: var(--ink-soft);
      font-weight: 780;
    }

    .citation-number {
      position: relative;
      display: inline-block;
      color: var(--accent-dark);
      font-weight: 800;
      cursor: help;
    }

    .citation-number::after {
      position: absolute;
      right: 0;
      bottom: calc(100% + 9px);
      z-index: 80;
      width: min(420px, 78vw);
      padding: 11px 12px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      box-shadow: 0 12px 28px rgba(24, 52, 61, 0.16);
      content: attr(data-citation);
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.48;
      text-align: left;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition:
        opacity 120ms ease,
        transform 120ms ease;
    }

    .citation-number:hover::after,
    .citation-number:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .citation-number:focus-visible {
      outline: 2px solid rgba(23, 108, 116, 0.35);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .citation-separator {
      color: var(--accent-dark);
    }

    .resources-library {
      display: grid;
      gap: 18px;
    }

    .resource-section-card {
      overflow: hidden;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .resource-section-card > summary {
      padding: clamp(24px, 3vw, 32px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px 28px;
      align-items: center;
      cursor: pointer;
      list-style: none;
    }

    .resource-section-card > summary::-webkit-details-marker,
    .framework-resource-item > summary::-webkit-details-marker,
    .resource-case-item > summary::-webkit-details-marker {
      display: none;
    }

    .resource-section-card[open] > summary {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .resource-summary-copy {
      min-width: 0;
    }

    .resource-summary-title {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: clamp(1.35rem, 2.4vw, 1.75rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .resource-summary-description {
      display: block;
      max-width: 820px;
      color: var(--ink-soft);
      font-size: 0.96rem;
      line-height: 1.58;
    }

    .resource-summary-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-dark);
      font-size: 0.82rem;
      font-weight: 780;
      white-space: nowrap;
    }

    .resource-summary-action .open-label {
      display: none;
    }

    .resource-section-card[open] .resource-summary-action .closed-label {
      display: none;
    }

    .resource-section-card[open] .resource-summary-action .open-label {
      display: inline;
    }

    .resource-summary-arrow {
      transition: transform 150ms ease;
    }

    .resource-section-card[open] > summary .resource-summary-arrow,
    .framework-resource-item[open] > summary .resource-summary-arrow,
    .resource-case-item[open] > summary .resource-summary-arrow {
      transform: rotate(180deg);
    }

    .resource-section-content {
      padding: clamp(24px, 3vw, 32px);
    }

    .framework-resource-list,
    .resource-case-list {
      display: grid;
      gap: 14px;
    }

    .framework-resource-item,
    .resource-case-item {
      overflow: hidden;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .framework-resource-item > summary,
    .resource-case-item > summary {
      padding: 19px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px 24px;
      align-items: center;
      cursor: pointer;
      list-style: none;
    }

    .framework-resource-item[open] > summary,
    .resource-case-item[open] > summary {
      background: #fbfdfd;
      border-bottom: 1px solid var(--line);
    }

    .framework-resource-name,
    .resource-case-name {
      display: block;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.38;
    }

    .framework-resource-summary {
      display: block;
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 0.84rem;
      font-weight: 650;
      line-height: 1.5;
    }

    .framework-resource-body,
    .resource-case-body {
      padding: 20px 22px 22px;
      color: var(--ink-soft);
    }

    .framework-resource-body p:last-child,
    .resource-case-body p:last-child {
      margin-bottom: 0;
    }

    .framework-resource-body strong,
    .resource-case-body strong {
      color: var(--ink);
    }

    .resource-case-context {
      margin: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(110px, 0.22fr) minmax(0, 1fr);
      gap: 8px 18px;
      background: var(--surface);
      border-radius: 8px;
    }

    .resource-case-context dt {
      color: var(--ink);
      font-weight: 750;
    }

    .resource-case-context dd {
      margin: 0;
    }

    .resource-case-subsection + .resource-case-subsection {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .resource-case-subsection h4 {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font-size: 0.84rem;
      font-weight: 850;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .resource-outcome-evidence-list {
      display: grid;
      gap: 11px;
    }

    .resource-outcome-evidence {
      padding: 14px 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .resource-outcome-evidence h5 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .resource-outcome-evidence p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.83rem;
      line-height: 1.52;
    }

    .resource-evidence-relationship {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 760;
    }

    .complete-reference-note {
      margin: 0 0 22px;
      color: var(--ink-soft);
    }

    .complete-reference-list {
      margin: 0;
      padding-left: 28px;
    }

    .complete-reference-list li {
      padding-left: 7px;
      color: var(--ink-soft);
      line-height: 1.58;
      overflow-wrap: anywhere;
    }

    .complete-reference-list li + li {
      margin-top: 14px;
    }

    .complete-reference-list a {
      display: inline;
      color: var(--accent-dark);
      font-weight: 650;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 720px) {
      .resource-section-card > summary,
      .framework-resource-item > summary,
      .resource-case-item > summary {
        grid-template-columns: 1fr;
      }

      .resource-summary-action {
        justify-self: start;
      }
    }

    .site-footer {
      padding: 38px 0;
      color: var(--muted);
      background: var(--surface);
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-inner p {
      margin: 0;
    }

    @media (max-width: 1450px) {
      .desktop-navigation {
        display: none;
      }

      .menu-button {
        display: grid;
      }
    }

    @media (max-width: 920px) {
      .desktop-navigation {
        display: none;
      }

      .menu-button {
        display: grid;
      }

      .step-card-layout {
        grid-template-columns: 1fr;
      }

      .flow-arrow {
        min-height: 38px;
      }

      .reasoning-model {
        grid-template-columns: 1fr;
      }

      .reasoning-node {
        width: 100%;
        min-height: auto;
      }

      .relationship-symbol {
        text-align: center;
        transform: rotate(90deg);
      }

      .builder-explanation,
      .important-grid,
      .outcome-layout {
        grid-template-columns: 1fr;
      }

      .outcome-sidebar {
        position: static;
      }

      .role-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .outcome-navigation {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .builder-map {
        grid-template-columns: 1fr;
      }

      .builder-column > p {
        min-height: auto;
      }
    }

    @media (max-width: 1100px) {
      .instruction-overview {
        grid-template-columns: 1fr;
        gap: 44px;
      }

      .instruction-overview-card {
        min-height: auto;
      }

      .instruction-overview-card:not(:last-child)::after {
        top: auto;
        right: auto;
        bottom: -34px;
        left: 50%;
        content: "↓";
        transform: translateX(-50%);
      }
    }

    @media (max-width: 760px) {
      .outcome-detail {
        padding: 24px 18px;
      }

      .evidence-table-wrap {
        overflow: visible;
        border: 0;
        border-radius: 0;
      }

      .evidence-table,
      .evidence-table tbody,
      .evidence-table tr,
      .evidence-table td {
        display: block;
        width: 100%;
      }

      .evidence-table thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .evidence-table tbody {
        padding: 18px;
        background: white;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
      }

      .evidence-table tbody + tbody {
        margin-top: 14px;
      }

      .evidence-table tbody tr {
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
      }

      .evidence-table tbody + tbody .case-evidence-row td {
        border-top: 0;
      }

      .evidence-table td {
        padding: 0;
      }

      .evidence-table td + td {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line) !important;
      }

      .evidence-table td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 7px;
        color: var(--accent-dark);
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .evidence-table .case-context-row td {
        margin-top: 14px;
        padding-top: 0;
        border-top: 0 !important;
      }

      .evidence-table .case-context-cell::before {
        display: none;
      }

      .case-context dl,
      .resource-case-context {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .case-context dd + dt,
      .resource-case-context dd + dt {
        margin-top: 9px;
      }
    }

    @media (max-width: 640px) {
      .brand-text {
        max-width: 205px;
      }

      .shortcut,
      .next-step,
      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .shortcut .text-link,
      .next-step .button,
      .button-row,
      .button-row .button {
        width: 100%;
      }

      .outcome-navigation,
      .resource-grid,
      .role-card-grid,
      .reflection-grid,
      .recommendation-list {
        grid-template-columns: 1fr;
      }

      .strategy-category-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }

      .custom-notes-fields {
        grid-template-columns: 1fr;
      }

      .strategy-row {
        padding: 16px;
      }

      .strategy-row-description,
      .strategy-row-meta,
      .strategy-visual,
      .custom-notes-editor,
      .interview-prompts {
        margin-left: 0;
      }

      .interview-prompts-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding-top: 54px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    /* ============================================================
       COMPACT TYPOGRAPHY AND SCROLL PROMPT
       ============================================================ */

    body {
      font-size: 12.5px;
      line-height: 1.55;
    }

    h1 {
      max-width: 720px;
      margin-bottom: 16px;
      font-size: clamp(2.25rem, 3vw, 3.1rem) !important;
      line-height: 1.08;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(1.4rem, 2vw, 1.8rem) !important;
      line-height: 1.2;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .brand {
      font-size: 0.98rem;
    }

    .navigation-link {
      font-size: 0.9rem;
    }

    .eyebrow {
      margin-bottom: 10px;
      font-size: 0.7rem;
    }

    .lede {
      max-width: 730px;
      margin-bottom: 16px;
      font-size: clamp(0.98rem, 1.4vw, 1.08rem) !important;
      line-height: 1.55;
    }

    .definition {
      max-width: 730px;
      margin-top: 20px;
      padding-left: 15px;
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .section-heading {
      margin-bottom: 28px;
    }

    .section-heading p {
      font-size: 0.96rem;
    }

    .step-card p,
    .preview-list,
    .builder-explanation p,
    .information-panel p,
    .outcome-detail p,
    .resource-card p {
      font-size: 0.92rem;
    }

    .step-card h3 {
      font-size: 1.08rem;
    }

    .reasoning-node p {
      font-size: 0.92rem;
    }

    .builder-column h2,
    .resource-card h2 {
      font-size: 1.12rem !important;
    }

    .next-step h2 {
      font-size: clamp(1.25rem, 1.8vw, 1.55rem) !important;
    }

    .hero {
      padding-top: clamp(38px, 5vw, 58px);
      padding-bottom: clamp(36px, 5vw, 54px);
    }

    .hero.compact {
      padding-top: clamp(36px, 5vw, 52px);
      padding-bottom: clamp(36px, 5vw, 52px);
    }

    .section {
      padding-top: clamp(44px, 5.5vw, 68px);
      padding-bottom: clamp(44px, 5.5vw, 68px);
    }

    .scroll-prompt {
      width: fit-content;
      min-height: 42px;
      margin-top: 26px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .scroll-prompt:hover {
      background: white;
      border-color: var(--accent);
    }

    .scroll-arrow {
      display: inline-block;
      font-size: 1.15rem;
      line-height: 1;
      animation: scroll-prompt-bounce 1.6s ease-in-out infinite;
    }

    @keyframes scroll-prompt-bounce {
      0%,
      100% {
        transform: translateY(-2px);
      }

      50% {
        transform: translateY(3px);
      }
    }

    @media (max-width: 640px) {
      body {
        font-size: 12.5px;
      }

      h1 {
        font-size: clamp(2rem, 10vw, 2.6rem) !important;
      }

      .lede {
        font-size: 1rem !important;
      }

      .scroll-prompt {
        width: 100%;
        justify-content: center;
        text-align: center;
      }

    @media (prefers-reduced-motion: reduce) {
      .scroll-arrow {
        animation: none;
      }

    /* ============================================================
       START HERE, RESPONSIVE FULL-SCREEN SECTIONS
       ============================================================ */

    .start-page h1 {
      max-width: none;
      margin-bottom: clamp(12px, 1.8vh, 18px);
      font-size: clamp(2.15rem, 3.2vw, 3.25rem) !important;
      line-height: 1.08;
    }

    .start-page h2 {
      margin-bottom: clamp(8px, 1.3vh, 13px);
      font-size: clamp(1.35rem, 2vw, 1.8rem) !important;
      line-height: 1.18;
    }

    .start-page h3 {
      margin-bottom: 6px;
      font-size: clamp(0.98rem, 1.1vw, 1.08rem);
    }

    .start-page .lede {
      max-width: 930px;
      margin-bottom: clamp(10px, 1.5vh, 16px);
      font-size: clamp(0.94rem, 1.15vw, 1.08rem) !important;
      line-height: 1.52;
    }

    .start-page .definition {
      max-width: 930px;
      margin-top: clamp(14px, 2vh, 21px);
      padding-left: 14px;
      font-size: clamp(0.85rem, 0.95vw, 0.96rem);
      line-height: 1.5;
    }

    .start-page .eyebrow {
      margin-bottom: clamp(8px, 1.3vh, 12px);
      font-size: clamp(0.66rem, 0.7vw, 0.75rem);
    }

    .start-page .section-heading {
      width: 100%;
      max-width: none;
      margin-bottom: clamp(16px, 2.5vh, 25px);
    }

    .start-page .section-heading p {
      width: 100%;
      max-width: none;
      margin-bottom: 0;
      font-size: clamp(0.84rem, 0.95vw, 0.94rem);
      line-height: 1.48;
    }

    .start-page .step-flow {
      gap: 12px;
    }

    .start-page .step-card {
      padding: clamp(17px, 2.2vw, 24px);
    }

    .start-page .step-number {
      margin-bottom: 10px;
      padding: 4px 8px;
      font-size: 0.66rem;
    }

    .start-page .step-card p {
      margin-bottom: 10px;
      font-size: clamp(0.8rem, 0.9vw, 0.9rem);
      line-height: 1.45;
    }

    .start-page .preview-list {
      margin-top: 10px;
      margin-bottom: 14px;
      padding-top: 9px;
      font-size: clamp(0.78rem, 0.86vw, 0.87rem);
      line-height: 1.4;
    }

    .start-page .preview-list li {
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .start-page .step-detail > p {
      margin: 0;
    }

    .start-page .step-workflow-node p {
      margin: 6px 0 0;
      font-size: clamp(0.78rem, 0.84vw, 0.84rem);
      line-height: 1.45;
    }

    .start-page .button {
      min-height: 40px;
      padding: 7px 13px;
      font-size: clamp(0.78rem, 0.85vw, 0.88rem);
    }

    .start-page .shortcut {
      margin-top: 13px;
      padding: 10px 14px;
      font-size: clamp(0.78rem, 0.85vw, 0.88rem);
    }

    .start-page .scroll-prompt {
      min-height: 38px;
      margin-top: clamp(16px, 2.2vh, 23px);
      padding: 7px 11px;
      font-size: clamp(0.76rem, 0.82vw, 0.86rem);
    }

    /* ============================================================
       WORKFLOW NODES
       ============================================================ */

    .workflow-node {
      min-height: clamp(48px, 6vh, 62px);
      padding: 10px 14px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      text-align: center;
      font-size: clamp(0.8rem, 0.9vw, 0.92rem);
      font-weight: 750;
      line-height: 1.3;
    }

    .workflow-arrow {
      height: clamp(22px, 3vh, 30px);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: clamp(1.05rem, 1.3vw, 1.3rem);
      font-weight: 800;
    }

    .start-hero-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1.3fr)
        minmax(340px, 0.7fr);
      gap: clamp(40px, 6vw, 84px);
      align-items: center;
    }

    .start-hero-copy {
      min-width: 0;
    }

    .start-hero-flow {
      width: 100%;
      max-width: 430px;
      padding: clamp(20px, 2.5vw, 28px);
      align-self: center;
      justify-self: end;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .workflow-title {
      margin-bottom: 14px;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
    }

    .guide-overview-node {
      min-height: 98px;
      padding: 13px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
    }

    .guide-overview-node span {
      color: var(--accent-dark);
      font-size: 0.61rem;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .guide-overview-node strong {
      color: var(--ink);
      font-size: 0.81rem;
      line-height: 1.3;
    }

    .guide-overview-node p {
      margin: 2px 0 0;
      color: var(--ink-soft);
      font-size: 0.69rem;
      font-weight: 400;
      line-height: 1.38;
    }

    .start-hero-flow .workflow-node {
      min-height: 98px;
    }

    .start-hero-flow .workflow-arrow {
      height: 24px;
    }

    /* ============================================================
       DESKTOP FULL-SCREEN HERO
       ============================================================ */

    @media (min-width: 921px) {
      .start-page > .hero {
        width: 100%;
        min-height: calc(100vh - var(--header-height));
        min-height: calc(100dvh - var(--header-height));
        padding-top: clamp(28px, 4vh, 44px);
        padding-bottom: clamp(28px, 4vh, 44px);
        display: flex;
        align-items: center;
        scroll-margin-top: var(--header-height);
      }

      .start-hero-layout {
        width: 100%;
      }

      .start-hero-flow {
        align-self: center;
      }
    }

    /* Keep the Guide at a Glance visually centered on shorter laptop screens. */
    @media (min-width: 921px) and (max-height: 760px) {
      .start-hero-flow {
        padding: 16px 20px;
      }

      .workflow-title {
        margin-bottom: 10px;
      }

      .guide-overview-node,
      .start-hero-flow .workflow-node {
        min-height: 82px;
        padding: 10px 13px;
      }

      .start-hero-flow .workflow-arrow {
        height: 18px;
      }
    }

    /* ============================================================
       TABLET AND MOBILE
       ============================================================ */

    @media (max-width: 920px) {
      .start-page > .hero {
        min-height: auto;
      }

      .start-hero-layout {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .start-hero-flow {
        max-width: none;
        justify-self: stretch;
      }

      .start-hero-flow .workflow-node {
        min-height: auto;
      }
    }

    @media (max-width: 640px) {
      .workflow-node {
        min-height: 52px;
        font-size: 0.9rem;
      }

      .guide-overview-node {
        padding: 14px 15px;
      }

      .guide-overview-node p {
        font-size: 0.72rem;
        line-height: 1.42;
      }
    }

    /* ============================================================
       INTEREST HOLDER, MINIMAL FIRST-FAMILY REVISION
       ============================================================ */

    .interest-hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(320px, 0.7fr);
      gap: clamp(28px, 5vw, 72px);
      align-items: start;
    }

    .interest-hero-copy {
      min-width: 0;
    }

    .interest-tab-guidance {
      min-width: 0;
      padding: 22px 23px;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .interest-tab-guidance h2 {
      margin: 0 0 13px;
      font-size: 1.08rem !important;
      line-height: 1.3;
    }

    .interest-tab-guidance ul {
      margin: 0;
      padding-left: 20px;
      color: var(--ink-soft);
      font-size: 0.84rem;
      line-height: 1.52;
    }

    .interest-tab-guidance li + li {
      margin-top: 8px;
    }

    .scaffold-family {
      padding: clamp(24px, 4vw, 36px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .scaffold-family-header {
      max-width: 930px;
      margin-bottom: 27px;
    }

    .scaffold-family-header h3 {
      margin-bottom: 12px;
      font-size: clamp(1.35rem, 2vw, 1.75rem);
    }

    .scaffold-family-definition {
      max-width: 850px;
      margin-bottom: 18px;
      color: var(--ink-soft);
      font-size: 0.96rem;
      line-height: 1.62;
    }

    .scaffold-family-interest {
      max-width: 880px;
      margin: 0;
      padding: 16px 18px;
      color: var(--ink-soft);
      background: var(--accent-soft);
      border-radius: var(--radius);
    }

    .scaffold-family-interest strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-dark);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scaffold-family-interest p {
      margin: 0;
    }

    .scaffold-groups {
      margin-top: 28px;
    }

    .scaffold-groups > h4,
    .scaffold-family-reflection > h4 {
      margin: 0 0 14px;
      font-size: 1.04rem;
      line-height: 1.35;
    }

    .scaffold-group-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .scaffold-group-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .scaffold-group-core {
      padding: 21px 21px 17px;
    }

    .scaffold-group-card h5 {
      margin: 0 0 9px;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.35;
    }

    .scaffold-group-core p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.86rem;
      line-height: 1.58;
    }

    .scaffold-examples {
      margin-top: auto;
      background: white;
      border-top: 1px solid var(--line);
    }

    .scaffold-examples summary,
    .scaffold-evidence summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      list-style: none;
    }

    .scaffold-examples summary {
      padding: 11px 20px;
      color: var(--accent-dark);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .scaffold-examples summary::-webkit-details-marker,
    .scaffold-evidence summary::-webkit-details-marker {
      display: none;
    }

    .scaffold-examples summary::after,
    .scaffold-evidence summary::after {
      content: "+";
      flex: 0 0 auto;
      color: var(--accent-dark);
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1;
    }

    .scaffold-examples[open] summary::after,
    .scaffold-evidence[open] summary::after {
      content: "−";
    }

    .scaffold-examples summary:hover,
    .scaffold-evidence summary:hover {
      background: var(--accent-soft);
    }

    .scaffold-examples summary:focus-visible,
    .scaffold-evidence summary:focus-visible {
      outline: 3px solid rgba(23, 108, 116, 0.35);
      outline-offset: -3px;
    }

    .scaffold-examples p {
      margin: 0;
      padding: 0 20px 18px;
      color: var(--ink-soft);
      font-size: 0.8rem;
      line-height: 1.55;
    }

    .scaffold-overlap-note {
      margin: 16px 0 0;
      padding: 13px 15px;
      color: var(--ink-soft);
      background: var(--notice);
      border: 1px solid var(--notice-line);
      border-radius: 10px;
      font-size: 0.84rem;
      line-height: 1.52;
    }

    .scaffold-overlap-note strong {
      color: var(--ink);
    }

    .scaffold-family-reflection {
      margin-top: 30px;
      padding-top: 27px;
      border-top: 1px solid var(--line);
    }

    .scaffold-reflection-grid {
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      list-style: none;
      counter-reset: scaffold-reflection;
    }

    .scaffold-reflection-grid li {
      min-width: 0;
      padding: 16px 17px;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-weight: 650;
      line-height: 1.5;
      counter-increment: scaffold-reflection;
    }

    .scaffold-reflection-grid li::before {
      content: counter(scaffold-reflection);
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--accent-dark);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 850;
    }

    .scaffold-evidence {
      margin-top: 19px;
      overflow: hidden;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
    }

    .scaffold-evidence summary {
      padding: 15px 18px;
    }

    .scaffold-evidence-title {
      display: block;
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 780;
      line-height: 1.35;
    }

    .scaffold-evidence-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .scaffold-evidence-content {
      padding: 0 18px 18px;
      border-top: 1px solid var(--line);
    }

    .scaffold-evidence-content p {
      margin: 15px 0 0;
      color: var(--ink-soft);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .interest-hero-layout {
        grid-template-columns: 1fr;
      }

      .interest-tab-guidance {
        max-width: 860px;
      }

      .scaffold-group-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .interest-tab-guidance,
      .scaffold-family {
        padding: 20px 17px;
      }

      .scaffold-group-grid,
      .scaffold-reflection-grid {
        grid-template-columns: 1fr;
      }

      .scaffold-group-core {
        padding: 19px 18px 16px;
      }
    }

    /* Interest Holder refinements requested after first-family review. */
    .interest-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    /* Keep the intro full-screen while restoring a little more breathing room
       at the left and right edges. */
    .interest-fullscreen-hero > .container,
    .potential-interest-section > .container,
    .interest-recommendations-section > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .interest-scroll-prompt {
      cursor: pointer;
    }

    /* Account for the sticky header when using the smooth in-page jump. */
    #potential-interest-holders-title {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    /* Let the Potential Interest Holders introduction use the same content
       width as the large scaffold card below it. */
    .potential-interest-section .section-heading,
    .potential-interest-section .section-heading p {
      width: 100%;
      max-width: none;
    }

    .scaffold-usage-guidance,
    .recommendation-guidance-list {
      margin: -10px 0 28px;
      padding: 17px 20px 17px 38px;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .scaffold-usage-guidance {
      width: 100%;
      max-width: none;
      background: white;
    }

    .scaffold-usage-guidance li + li,
    .recommendation-guidance-list li + li {
      margin-top: 7px;
    }

    .recommendation-guidance-list {
      max-width: 860px;
      margin-top: -8px;
      background: var(--surface);
    }

    .scaffold-family-header,
    .scaffold-family-definition,
    .scaffold-family-interest {
      max-width: none;
    }

    .scaffold-reflection-grid li {
      font-weight: 400;
    }

    /* Examples are open by default in the markup. Giving every open example
       area the same minimum height keeps the three cards visually aligned. */
    .scaffold-group-card {
      height: 100%;
    }

    .scaffold-group-core {
      flex: 1 1 auto;
    }

    .scaffold-examples[open] {
      min-height: 152px;
    }

    @media (max-width: 640px) {
      .interest-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .interest-fullscreen-hero > .container,
      .potential-interest-section > .container,
      .interest-recommendations-section > .container {
        padding-inline: 20px;
      }

      .scaffold-usage-guidance,
      .recommendation-guidance-list {
        margin-top: -6px;
        padding: 15px 16px 15px 34px;
      }

      /* A fixed visual rhythm is less important on the one-column mobile layout. */
      .scaffold-examples[open] {
        min-height: 0;
      }
    }


    /* ============================================================
       INTEREST HOLDER, FULL FAMILY SCAFFOLD / PROGRESSIVE DISCLOSURE
       ============================================================ */

    .family-overview {
      margin: 4px 0 30px;
      padding: clamp(20px, 3vw, 28px);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .family-overview-heading {
      margin-bottom: 17px;
    }

    .family-overview-heading .placeholder-label {
      margin-bottom: 6px;
    }

    .family-overview-heading h3 {
      margin: 0;
      font-size: 1.16rem;
    }

    .family-overview-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 11px;
    }

    .family-overview-card {
      min-width: 0;
      min-height: 188px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        transform 140ms ease;
    }

    .family-overview-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .family-overview-card.is-active {
      background: #eef7f7;
      border-color: var(--accent);
    }

    .family-overview-number,
    .scaffold-family-number {
      display: block;
      margin-bottom: 7px;
      color: var(--accent-dark);
      font-size: 0.67rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .family-overview-title {
      display: block;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .family-overview-definition {
      display: block;
      margin-top: 9px;
      color: var(--ink-soft);
      font-size: 0.75rem;
      line-height: 1.47;
    }

    .family-overview-action {
      margin-top: auto;
      padding-top: 12px;
      color: var(--accent-dark);
      font-size: 0.72rem;
      font-weight: 780;
    }

    .scaffold-family-stack {
      display: grid;
      gap: 18px;
    }

    .scaffold-family {
      scroll-margin-top: calc(var(--header-height) + 24px);
      padding: 0;
      overflow: hidden;
    }

    .scaffold-family + .scaffold-family {
      margin-top: 0;
    }

    .scaffold-family-header {
      margin: 0;
      padding: clamp(24px, 3vw, 34px);
    }

    .scaffold-family-header h3 {
      margin-bottom: 10px;
    }

    .scaffold-family-definition {
      margin-bottom: 18px;
    }

    .scaffold-family-disclosure {
      min-height: 40px;
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-dark);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 780;
      cursor: pointer;
    }

    .scaffold-family-disclosure:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .scaffold-family-disclosure-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
    }

    .scaffold-family-content {
      padding: 0 clamp(24px, 3vw, 34px) clamp(24px, 3vw, 34px);
      border-top: 1px solid var(--line);
    }

    .scaffold-family-content > .scaffold-family-interest {
      margin-top: 26px;
    }

    .scaffold-group-grid.is-four-group {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .global-reflection-panel {
      margin-top: 30px;
      padding: clamp(24px, 4vw, 36px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .global-reflection-panel h3 {
      margin-bottom: 20px;
      font-size: clamp(1.28rem, 2vw, 1.62rem);
    }

    .global-reflection-panel .eyebrow {
      margin-bottom: 8px;
    }

    .global-reflection-grid li {
      font-weight: 400;
    }

    /* Page-level synthesis reflections for Implementation Outcomes and
       Evaluation Strategies. Reuses the Interest Holder reflection language
       while keeping longer cross-cutting prompts easy to scan. */
    .page-reflection-panel {
      margin-top: clamp(32px, 5vw, 54px);
    }

    .page-reflection-subtitle {
      max-width: 980px;
      margin: -7px 0 22px;
      color: var(--ink-soft);
      font-size: 0.94rem;
      line-height: 1.62;
    }

    .reflection-prompt-content {
      min-width: 0;
    }

    .reflection-question {
      display: block;
      color: var(--ink);
      font-size: 0.96rem;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .plan-add-panel[open] > summary {
      margin-bottom: 13px;
    }

    .plan-add-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .plan-add-option {
      width: 100%;
      min-width: 0;
      padding: 11px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      color: var(--ink-soft);
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
    }

    .plan-add-option:hover {
      border-color: var(--accent);
    }

    .plan-add-option strong {
      display: block;
      color: var(--ink);
      font-size: 0.79rem;
      line-height: 1.35;
    }

    .plan-add-option small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.4;
    }

    .plan-recommended-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 6px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 780;
    }

    .plan-strategy-category + .plan-strategy-category {
      margin-top: 28px;
    }

    .plan-strategy-category-header {
      margin-bottom: 12px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 15px;
    }

    .plan-strategy-category-header h4 {
      margin: 0;
      color: var(--ink);
      font-size: 0.94rem;
    }

    .plan-strategy-category-header span {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .plan-interview-card {
      padding: 20px;
      background: #eef7f7;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
    }

    .plan-interview-card .strategy-row-select-button {
      align-items: start;
    }

    .plan-interview-card .strategy-row-description,
    .plan-interview-card .strategy-row-meta {
      margin-left: 41px;
    }

    .plan-interview-prompts {
      margin: 16px 0 0 41px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .plan-selected-prompts {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .plan-prompt-card {
      padding: 11px 12px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 9px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .plan-prompt-remove {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--accent);
      border: 0;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 900;
      cursor: pointer;

      display: block;
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .plan-prompt-card p {

      color: var(--ink-soft);
      font-size: 0.76rem;
      line-height: 1.48;
    }

    .plan-custom-prompt-form {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 0.35fr) minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

      display: grid;
      grid-template-rows: auto 66px;
      align-self: stretch;
    }

    .plan-custom-prompt-form label span {
      display: block;
      margin-bottom: 5px;
      color: var(--ink);
      font-size: 0.7rem;
      font-weight: 760;

      height: 66px;
      min-height: 66px;
      padding: 8px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font: inherit;
      font-size: 0.75rem;

    .plan-custom-prompt-form textarea {

    .plan-custom-prompt-form .button {

      padding: 8px 11px;
      font-size: 0.75rem;

      line-height: 1.55;

      display: none;

      page-break-inside: avoid;

    .plan-print-outcome h2 {
      margin-bottom: 8px;

    .plan-print-group {
      margin-top: 16px;
    }

    .plan-print-group h3 {

      font-size: 1rem;

      padding-left: 20px;

    .plan-print-group li + li {
      margin-top: 5px;
    }

    .plan-print-group > p {
      white-space: pre-wrap;
    }

    .plan-option-legend {
      margin: 0 0 16px;
      padding: 12px 14px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 0.78rem;
      line-height: 1.5;

    .plan-option-legend strong {

    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;

      border-color: var(--line);
      box-shadow: none;
      transition:

        border-color 140ms ease,
        box-shadow 140ms ease;

    .plan-holder-card:not(.is-selected) h4,
    .plan-holder-card:not(.is-selected) .plan-holder-description {
      color: var(--muted);
    }

    .plan-holder-card:not(.is-selected) .plan-holder-family {
      color: #7d8d94;
    }

    .plan-holder-card.is-selected {
      background: #fbfefe;
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(23, 108, 116, 0.12);

      height: 26px;
      display: grid;
      place-items: center;

      font-weight: 900;

      transition:

        background 140ms ease,
        border-color 140ms ease;

      border-color: var(--accent);

    .plan-holder-card.is-selected .plan-holder-toggle {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

      font-weight: 780;

      border-color: var(--line);
      box-shadow: none;

    }

    .plan-interview-card {
      padding: 20px;
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition:
        background 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .plan-interview-card.is-selected {
      background: #eef7f7;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .plan-interview-card .strategy-row-select-button[aria-pressed="true"] .selection-indicator {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .plan-workspace-card .interview-prompt-option:not(.is-selected) {
      background: #fafbfb;
    }

    .plan-workspace-card .interview-prompt-option:not(.is-selected) .interview-prompt-title,
    .plan-workspace-card .interview-prompt-option:not(.is-selected) .interview-prompt-question {
      color: var(--muted);
    }

    .plan-outcome-nav-status.is-unselected {
      color: var(--line-strong);
    }

    @media (max-width: 1080px) {
      .plan-outcome-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .plan-builder-layout {
        grid-template-columns: 1fr;
      }

      .plan-builder-sidebar {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .plan-builder-sidebar-label {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      .develop-plan-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }

        padding-inline: 20px;
      }

      .plan-toolbar,
      .plan-outcome-selector-header,
      .plan-strategy-category-header {
        align-items: stretch;
        flex-direction: column;
      }

      .plan-toolbar-actions {
        justify-content: flex-start;
      }

      .plan-outcome-options,
      .plan-add-options,
      .plan-builder-sidebar,
      .plan-all-options-grid {
        grid-template-columns: 1fr;
      }

      .plan-holder-description,
      .plan-holder-card details,
      .plan-interview-card .strategy-row-description,
      .plan-interview-card .strategy-row-meta,
      .plan-interview-prompts {
        margin-left: 0;
      }

      .plan-custom-prompt-form {
        grid-template-columns: 1fr;
      }

      .plan-custom-prompt-form .button {
        min-height: 48px;
      }
    }

    @media print {
      @page {
        margin: 0.55in;
      }

      .site-header,
      .site-footer,
      .develop-plan-fullscreen-hero,
      .plan-workspace-screen {
        display: none !important;
      }

      .plan-builder-section.section {
        padding: 0 !important;
      }

      .plan-print-only {
        display: block !important;
      }

      body {
        color: #111 !important;
        background: white !important;
      }

      a {
        color: inherit !important;
        text-decoration: none !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    function getRoute() {

    function PageLink({ route, children, secondary = false }) {
      return (

      return (

    function normalizeCitationIds(citations = []) {
      const ids = citations
        .map((citation) => {
          if (typeof citation === "number") {
            return LEGACY_REFERENCE_ID_BY_NUMBER[citation] || null;
          }

          if (REFERENCE_LIBRARY[citation]) {
            return citation;
          }

          return REFERENCE_ID_BY_LABEL[citation] || null;
        })
        .filter(Boolean)
        .filter((referenceId) => REFERENCE_NUMBER_BY_ID[referenceId]);

      return Array.from(new Set(ids)).sort(
        (a, b) =>
          REFERENCE_NUMBER_BY_ID[a] - REFERENCE_NUMBER_BY_ID[b]
      );
    }

    function CitationNumbers({ ids }) {
      const citationIds = normalizeCitationIds(ids);

      if (citationIds.length === 0) {
        return null;
      }

      return (
        <sup className="citation" aria-label="References">
          {citationIds.map((referenceId, index) => {
            const reference = REFERENCE_LIBRARY[referenceId];
            const number = REFERENCE_NUMBER_BY_ID[referenceId];
            const tooltip = `${number}. ${reference.citation} ${reference.url}`;

            return (
              <React.Fragment key={referenceId}>
                {index > 0 && <span className="citation-separator">,</span>}
                <span
                  className="citation-number"
                  tabIndex="0"
                  title={tooltip}
                  data-citation={tooltip}
                  aria-label={`Reference ${number}: ${reference.citation}`}
                >
                  {number}
                </span>
              </React.Fragment>
            );
          })}
        </sup>
      );
    }

    function renderTextWithInlineCitations(value) {
      if (typeof value !== "string") {
        return value;
      }

      const citationPattern = /\(([^()]*(?:19|20)\d{2}[^()]*)\)/g;
      const parts = [];
      let lastIndex = 0;
      let match;
      let citationGroupIndex = 0;

      while ((match = citationPattern.exec(value)) !== null) {
        const labels = match[1]
          .split(";")
          .map((label) => label.trim());
        const ids = labels.map(
          (label) => REFERENCE_ID_BY_LABEL[label]
        );

        if (
          labels.length === 0 ||
          ids.some((referenceId) => !referenceId)
        ) {
          continue;
        }

        parts.push(value.slice(lastIndex, match.index));
        parts.push(
          <CitationNumbers
            ids={ids}
            key={`inline-citation-${citationGroupIndex}`}
          />
        );
        citationGroupIndex += 1;
        lastIndex = match.index + match[0].length;
      }

      if (parts.length === 0) {
        return value;
      }

      parts.push(value.slice(lastIndex));
      return parts;
    }

    function CitationText({ text }) {
      const isStructuredText =
        text !== null && typeof text === "object";
      const displayText = isStructuredText ? text.text : text;

      return (
        <>
          {renderTextWithInlineCitations(displayText)}
          {isStructuredText && text.citations?.length > 0 && (
            <CitationNumbers ids={text.citations} />
          )}
        </>
      );
    }
