<!DOCTYPE html>
<!--
  Current prototype summary:
  - Expanded the guide from four routes to six: Start Here, Discover Implementation
    Outcomes, Discover Interest Holders, Discover Evaluation Strategies, Final
    Evaluation Plan, and Resources.
  - Updated the primary navigation, hash routing, application page selection, and
    Start Here workflow to match the new four-step evaluation-planning sequence.
  - Refined Discover Interest Holders with a concise source-bounded definition,
    a legitimate-interest scaffold, reflection prompts, outcome-specific selections,
    and editable project examples and notes.
  - Added full-width, selectable, outcome-specific evaluation strategies from the
    Round 2 prototype, including author-year article links, available instruments,
    supporting visuals, editable notes, and selectable interview prompts.
  - Added explicit implementation-outcome relevance selection, separate from the
    currently reviewed outcome, with shared session state and sidebar status marks.
  - Added continuation links from Outcomes to Interest Holders and from the Final
    Evaluation Plan to Resources; selections persist in shared session state.
  - Intentionally deferred final interest-holder decision rules, outcome-to-strategy
    recommendations, final-plan selection logic, and download/export behavior.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="A guide for considering implementation outcomes and planning evaluation during mid-design."
  />

  <title>Mid-Design Evaluation Guide</title>

  <!-- Preserves the existing Round 2 React/Babel approach. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --ink: #17282f;
      --ink-soft: #465d67;
      --muted: #667982;
      --line: #d7e1e4;
      --line-strong: #bacbd0;
      --white: #ffffff;
      --surface: #f4f8f8;
      --accent-soft: #e1eff0;
      --accent: #176c74;
      --accent-dark: #0e5057;
      --notice: #f6f3e8;
      --notice-line: #c8b96f;
      --shadow: 0 14px 34px rgba(24, 52, 61, 0.08);
      --radius: 14px;
      --radius-large: 20px;
      --content-width: 1120px;
      --reading-width: 780px;
      --page-gutter: clamp(28px, 6vw, 112px);
      --layout-width: 1472px;
      --header-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 90.625%;
      scroll-behavior: smooth;
      scroll-padding-top: var(--header-height);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 14.5px;
      line-height: 1.62;
    }

    body,
    #root {
      min-height: 100vh;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--accent-dark);
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(23, 108, 116, 0.35);
      outline-offset: 3px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.18;
      letter-spacing: -0.025em;
    }

    h1 {
      max-width: 880px;
      margin-bottom: 22px;
      font-size: clamp(2.35rem, 6vw, 4.5rem);
    }

    h2 {
      margin-bottom: 16px;
      font-size: clamp(1.75rem, 3.6vw, 2.55rem);
    }

    h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 10px 14px;
      color: white;
      background: var(--accent-dark);
      border-radius: 8px;
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .container {
      width: 100%;
      max-width: var(--layout-width);
      margin: 0 auto;
      padding-inline: var(--page-gutter);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .nav-shell {
      width: 100%;
      max-width: var(--layout-width);
      min-height: 72px;
      margin: 0 auto;
      padding-inline: var(--page-gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 750;
      line-height: 1.25;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: white;
      background: var(--accent);
      border-radius: 50%;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .desktop-navigation {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .navigation-link {
      min-height: 44px;
      padding: 10px 13px;
      display: inline-flex;
      align-items: center;
      color: var(--ink-soft);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.91rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .navigation-link:hover {
      color: var(--accent-dark);
      background: var(--surface);
    }

    .navigation-link[aria-current="page"] {
      color: var(--accent-dark);
      background: var(--accent-soft);
    }

    .menu-button {
      width: 46px;
      height: 46px;
      display: none;
      place-items: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      cursor: pointer;
    }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      width: 20px;
      height: 2px;
      display: block;
      background: var(--ink);
      border-radius: 2px;
      transition: 160ms ease;
    }

    .menu-icon {
      position: relative;
    }

    .menu-icon::before,
    .menu-icon::after {
      position: absolute;
      left: 0;
      content: "";
    }

    .menu-icon::before {
      top: -6px;
    }

    .menu-icon::after {
      top: 6px;
    }

    .menu-button[aria-expanded="true"] .menu-icon {
      background: transparent;
    }

    .menu-button[aria-expanded="true"] .menu-icon::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button[aria-expanded="true"] .menu-icon::after {
      top: 0;
      transform: rotate(-45deg);
    }

    .mobile-navigation {
      display: none;
      padding: 0 20px 18px;
      background: white;
      border-top: 1px solid var(--line);
    }

    .mobile-navigation.open {
      display: grid;
      gap: 4px;
    }

    main {
      min-height: calc(100vh - 180px);
    }

    .hero {
      padding: clamp(60px, 9vw, 108px) 0 clamp(52px, 7vw, 84px);
      background: linear-gradient(180deg, #f3f8f8 0%, white 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero.compact {
      padding: clamp(52px, 7vw, 80px) 0;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--accent-dark);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .lede {
      max-width: 830px;
      margin-bottom: 20px;
      color: var(--ink-soft);
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      line-height: 1.55;
    }

    .definition {
      max-width: 790px;
      margin: 28px 0 0;
      padding-left: 18px;
      color: var(--ink-soft);
      border-left: 4px solid var(--accent);
    }

    .definition strong {
      color: var(--ink);
    }

    .section {
      padding: clamp(64px, 8vw, 100px) 0;
    }

    .section.soft {
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .section-heading {
      max-width: var(--reading-width);
      margin-bottom: 38px;
    }

    .section-heading p {
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 1.05rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      min-height: 48px;
      padding: 11px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 750;
      cursor: pointer;
      transition:
        background 140ms ease,
        border-color 140ms ease,
        transform 140ms ease;
    }

    .button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .button.secondary {
      color: var(--accent-dark);
      background: white;
      border-color: var(--line-strong);
    }

    .button.secondary:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .button:disabled {
      color: var(--muted);
      background: #edf2f3;
      border-color: var(--line);
      cursor: not-allowed;
      transform: none;
    }

    .step-flow {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 18px;
    }

    .instruction-overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(34px, 3.5vw, 52px);
      align-items: stretch;
    }

    .instruction-overview-card {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
    }

    .instruction-overview-card:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: clamp(-36px, -2.4vw, -23px);
      color: var(--accent);
      content: "→";
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
      transform: translateY(-50%);
    }

    .instruction-overview-card p {
      margin-bottom: 22px;
      color: var(--ink-soft);
    }

    .instruction-overview-card .button {
      width: 100%;
      margin-top: auto;
    }

    .step-card {
      padding: clamp(25px, 4vw, 38px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .step-card-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 0.8fr)
        minmax(360px, 1.2fr);
      gap: clamp(28px, 5vw, 66px);
      align-items: start;
    }

    .step-card-copy {
      min-width: 0;
    }

    .step-number {
      width: fit-content;
      margin-bottom: 18px;
      padding: 5px 10px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .step-detail {
      min-width: 0;
      padding: clamp(18px, 2.5vw, 26px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .step-detail-label {
      margin-bottom: 10px;
      color: var(--accent-dark);
      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .step-detail h4 {
      margin: 0 0 9px;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.3;
    }

    .step-detail > p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .step-detail sup {
      margin-left: 2px;
      font-size: 0.72em;
      vertical-align: super;
    }

    .step-workflow {
      display: grid;
      gap: 0;
    }

    .step-workflow-node {
      padding: 15px 16px;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
    }

    .step-workflow-node strong {
      display: block;
      color: var(--ink);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .step-workflow-node p {
      color: var(--ink-soft);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .step-workflow-arrow {
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
    }

    /* Step 4: final-plan guidance reuses the existing step-detail visual system
       without repeating the Outcome → Who → How flow. */
    .final-plan-guidance {
      gap: 10px;
    }

    .final-plan-guidance-block {
      display: block;
      text-align: left;
    }

    .final-plan-guidance-block p {
      margin: 6px 0 0;
    }

    .final-plan-guidance-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .step-card p,
    .resource-card p,
    .builder-column > p {
      color: var(--ink-soft);
    }

    .preview-list {
      margin: 20px 0 25px;
      padding: 18px 0 0 20px;
      border-top: 1px solid var(--line);
    }

    .preview-list li {
      margin: 7px 0;
      color: var(--ink-soft);
    }

    .flow-arrow {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      text-decoration: none;
      font-size: 1.45rem;
      line-height: 1;
      transition:
        color 140ms ease,
        background 140ms ease,
        border-color 140ms ease,
        transform 140ms ease;
    }

    .flow-arrow:hover {
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(2px);
    }

    .section-jump {
      width: fit-content;
      min-height: 40px;
      margin: 18px auto 0;
      padding: 7px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-dark);
      border-bottom: 1px solid transparent;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .section-jump:hover {
      border-bottom-color: var(--accent);
    }

    .section-jump-icon {
      font-size: 1rem;
      transition: transform 140ms ease;
    }

    .section-jump:hover .section-jump-icon {
      transform: translateY(2px);
    }

    .shortcut {
      margin-top: 24px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .shortcut p {
      margin: 0;
      color: var(--ink-soft);
    }

    .text-link {
      flex: 0 0 auto;
      color: var(--accent-dark);
      font-weight: 750;
      text-underline-offset: 3px;
    }

    .reasoning-model {
      display: grid;
      grid-template-columns: repeat(5, auto);
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 28px);
      margin: 44px 0 32px;
    }

    .reasoning-node {
      width: clamp(150px, 20vw, 230px);
      min-height: 170px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
    }

    .reasoning-node span {
      margin-bottom: 12px;
      color: var(--accent-dark);
      font-size: 0.8rem;
      font-weight: 850;
      letter-spacing: 0.1em;
    }

    .reasoning-node p {
      margin: 0;
      font-weight: 680;
      line-height: 1.42;
    }

    .relationship-symbol {
      color: var(--accent);
      font-size: 1.7rem;
    }

    .rationale {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 22px;
      background: var(--accent-soft);
      border-radius: var(--radius);
    }

    .rationale strong {
      display: block;
      margin-bottom: 8px;
    }

    .rationale ul {
      margin: 0;
      padding-left: 20px;
      color: var(--ink-soft);
    }

    .builder-explanation {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: clamp(34px, 6vw, 80px);
      align-items: center;
    }

    .builder-explanation p {
      color: var(--ink-soft);
    }

    .connection-stack {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .connection-node {
      min-height: 76px;
      padding: 16px 18px;
      display: grid;
      place-items: center;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      text-align: center;
      font-weight: 750;
    }

    .connection-line {
      height: 35px;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
    }

    .important-grid {
      display: grid;
      grid-template-columns: 1.5fr 0.8fr;
      gap: 20px;
    }

    .information-panel {
      padding: 26px;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .information-panel p:last-child {
      margin-bottom: 0;
    }

    .session-notice {
      background: var(--notice);
      border-color: var(--notice-line);
    }

    .session-notice .eyebrow {
      color: #6d6026;
    }

    .next-step {
      padding: clamp(28px, 5vw, 44px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      color: white;
      background: var(--accent-dark);
      border-radius: var(--radius-large);
    }

    .next-step h2 {
      margin-bottom: 10px;
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    .next-step p {
      max-width: 680px;
      margin-bottom: 0;
      color: #dcebed;
    }

    .next-step .button {
      flex: 0 0 auto;
      color: var(--accent-dark);
      background: white;
      border-color: white;
    }

    .outcome-layout {
      display: grid;
      grid-template-columns: minmax(180px, 0.27fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .outcomes-intro.hero.compact {
      padding-top: clamp(30px, 4vw, 44px);
      padding-bottom: clamp(24px, 3.2vw, 34px);
    }

    .outcomes-intro .eyebrow {
      margin-bottom: 8px;
    }

    .outcomes-intro h1 {
      margin-bottom: 12px;
    }

    .outcomes-intro .lede {
      margin-bottom: 0;
    }

    /* Match the Interest Holder page's full-screen conceptual introduction. */
    .outcomes-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    .outcomes-fullscreen-hero > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .outcomes-fullscreen-hero .lede {
      max-width: 980px;
      margin-bottom: 20px;
    }

    .outcome-intro-instruction {
      max-width: 900px;
      margin: 18px 0 0;
      color: var(--ink-soft);
      font-size: 1rem;
      line-height: 1.7;
    }

    .outcomes-scroll-prompt {
      cursor: pointer;
    }

    #implementation-outcomes-content {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    /* Match the conceptual-intro structure used on the Outcomes and Interest Holder pages. */
    .evaluation-strategies-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    .evaluation-strategies-fullscreen-hero > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .evaluation-strategies-fullscreen-hero .lede {
      max-width: 980px;
      margin-bottom: 18px;
    }

    .strategy-intro-detail,
    .strategy-intro-instruction {
      max-width: 980px;
      color: var(--ink-soft);
      line-height: 1.7;
    }

    .strategy-intro-detail {
      margin: 0 0 16px;
      font-size: 1rem;
    }

    .strategy-intro-instruction {
      margin: 18px 0 0;
      font-size: 1rem;
    }

    .evaluation-strategies-scroll-prompt {
      cursor: pointer;
    }

    #evaluation-strategies-content {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    .outcomes-content.section {
      padding-top: clamp(28px, 4vw, 44px);
    }

    @media (max-width: 640px) {
      .outcomes-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .outcomes-fullscreen-hero > .container,
      .evaluation-strategies-fullscreen-hero > .container {
        padding-inline: 20px;
      }

      .evaluation-strategies-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }


      .outcome-detail-header {
        display: grid;
        gap: 14px;
      }

      .outcome-interest-control {
        width: fit-content;
      }
    }

    .outcome-navigation {
      position: sticky;
      top: 94px;
      display: grid;
      gap: 8px;
    }

    .outcome-button {
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      color: var(--ink-soft);
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;

      flex: 1 1 auto;
    }

      font-size: 0.78rem;
      line-height: 1.5;

        border-color 140ms ease;

    .outcome-interest-control:hover {
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .outcome-interest-control.is-selected {
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .outcome-interest-control:focus-within {
      outline: 3px solid rgba(23, 108, 116, 0.28);
      outline-offset: 3px;
    }

    .outcome-interest-control input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .outcome-interest-check {
      width: 22px;
      height: 22px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: transparent;
      background: white;
      border: 1.5px solid var(--line-strong);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
    }

    .outcome-interest-control.is-selected .outcome-interest-check {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .outcome-detail {
      min-width: 0;
      padding: clamp(25px, 4vw, 42px);
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .outcome-detail > h2 {
      margin-bottom: 24px;
    }

    .outcome-summary {
      display: grid;
      gap: 16px;
    }

    .outcome-definition,
    .outcome-relevance,
    .outcome-considerations {
      padding: 20px 22px;
      border-radius: var(--radius);
    }

    .outcome-definition {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
    }

    .outcome-relevance {
      background: #eef6f6;
      border: 1px solid #bdd5d8;

    .outcome-relevance.is-placeholder {

    .outcome-tag {

      border: 1px solid var(--accent);
    }

    .outcome-tag.forward {
      color: #5c5120;
      background: #f7f3df;
      border: 1px solid #c9b96e;
    }

    .outcome-considerations {
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .outcome-section-label {
      display: block;
      margin-bottom: 8px;

      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .outcome-definition p {
      margin: 0;
      color: var(--ink);
      font-size: 0.98rem;
    }

    .outcome-considerations ul {
      margin: 0;

      color: var(--ink-soft);
    }

    .evidence-section {

    .evidence-heading {

    }

    .evidence-heading h3 {

    }

    .evidence-table-wrap {

      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    .evidence-table th:nth-child(1) {
      width: 34%;

    .evidence-table th:nth-child(2) {

    }

    .evidence-table th:nth-child(3) {
      width: 21%;
    }

    .evidence-table tbody + tbody .case-evidence-row td {

    }

    .evidence-table .case-context-row td {

      border-top: 0;

    .evidence-table td {

      font-size: 0.84rem;

    .case-description {

      font-weight: 750;
      cursor: pointer;
      list-style: none;

    .case-context summary:hover {
      color: var(--accent);

    .case-context summary:focus-visible {

      gap: 8px 18px;
      background: var(--surface);
      border-radius: 8px;

    .case-context dt {
      color: var(--ink);
      font-weight: 750;

    .case-context dd {

      font-weight: 850;

        top: auto;
        right: auto;
        bottom: -34px;
        left: 50%;
        content: "↓";
        transform: translateX(-50%);
      }
    }

    @media (max-width: 760px) {
      .outcome-detail {
        padding: 24px 18px;
      }

      .evidence-table-wrap {
        overflow: visible;
        border: 0;
        border-radius: 0;
      }

      .evidence-table,
      .evidence-table tbody,
      .evidence-table tr,
      .evidence-table td {
        display: block;
        width: 100%;
      }

      .evidence-table thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .evidence-table tbody {
        padding: 18px;
        background: white;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
      }

      .evidence-table tbody + tbody {
        margin-top: 14px;
      }

      .evidence-table tbody tr {
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
      }

      .evidence-table tbody + tbody .case-evidence-row td {
        border-top: 0;
      }

      .evidence-table td {
        padding: 0;
      }

      .evidence-table td + td {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line) !important;
      }

      .evidence-table td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 7px;
        color: var(--accent-dark);
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .evidence-table .case-context-row td {
        margin-top: 14px;
        padding-top: 0;
        border-top: 0 !important;
      }

      .evidence-table .case-context-cell::before {
        display: none;
      }

      .case-context dl {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .case-context dd + dt {
        margin-top: 9px;
      }
    }

    @media (max-width: 640px) {

        max-width: 205px;
      }

      .shortcut,
      .next-step,
      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .shortcut .text-link,
      .next-step .button,
      .button-row,
      .button-row .button {
        width: 100%;
      }

      .outcome-navigation,
      .resource-grid,
      .role-card-grid,
      .reflection-grid,
      .recommendation-list {
        grid-template-columns: 1fr;
      }

      .strategy-category-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }

      .custom-notes-fields {
        grid-template-columns: 1fr;
      }

      .strategy-row {
        padding: 16px;
      }

      .strategy-row-description,
      .strategy-row-meta,
      .strategy-visual,
      .custom-notes-editor,
      .interview-prompts {
        margin-left: 0;
      }

      .interview-prompts-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding-top: 54px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }

    .scaffold-examples {
      margin-top: auto;
      background: white;
      border-top: 1px solid var(--line);
    }

    .scaffold-examples summary,
    .scaffold-evidence summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      list-style: none;
    }

    .scaffold-examples summary {
      padding: 11px 20px;
      color: var(--accent-dark);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .scaffold-examples summary::-webkit-details-marker,
    .scaffold-evidence summary::-webkit-details-marker {
      display: none;
    }

    .scaffold-examples summary::after,
    .scaffold-evidence summary::after {
      content: "+";
      flex: 0 0 auto;
      color: var(--accent-dark);
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1;
    }

    .scaffold-examples[open] summary::after,
    .scaffold-evidence[open] summary::after {
      content: "−";
    }

    .scaffold-examples summary:hover,
    .scaffold-evidence summary:hover {
      background: var(--accent-soft);
    }

    .scaffold-examples summary:focus-visible,
    .scaffold-evidence summary:focus-visible {
      outline: 3px solid rgba(23, 108, 116, 0.35);
      outline-offset: -3px;
    }

    .scaffold-examples p {
      margin: 0;
      padding: 0 20px 18px;
      color: var(--ink-soft);
      font-size: 0.8rem;
      line-height: 1.55;
    }

    .scaffold-overlap-note {
      margin: 16px 0 0;
      padding: 13px 15px;
      color: var(--ink-soft);
      background: var(--notice);
      border: 1px solid var(--notice-line);
      border-radius: 10px;
      font-size: 0.84rem;
      line-height: 1.52;
    }

    .scaffold-overlap-note strong {
      color: var(--ink);
    }

    .scaffold-family-reflection {
      margin-top: 30px;
      padding-top: 27px;
      border-top: 1px solid var(--line);
    }

    .scaffold-reflection-grid {
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      list-style: none;
      counter-reset: scaffold-reflection;
    }

    .scaffold-reflection-grid li {
      min-width: 0;
      padding: 16px 17px;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-weight: 650;
      line-height: 1.5;
      counter-increment: scaffold-reflection;
    }

    .scaffold-reflection-grid li::before {
      content: counter(scaffold-reflection);
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--accent-dark);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 850;
    }

    .scaffold-evidence {
      margin-top: 19px;
      overflow: hidden;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
    }

    .scaffold-evidence summary {
      padding: 15px 18px;
    }

    .scaffold-evidence-title {
      display: block;
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 780;
      line-height: 1.35;
    }

    .scaffold-evidence-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .scaffold-evidence-content {
      padding: 0 18px 18px;
      border-top: 1px solid var(--line);
    }

    .scaffold-evidence-content p {
      margin: 15px 0 0;
      color: var(--ink-soft);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .interest-hero-layout {
        grid-template-columns: 1fr;
      }

      .interest-tab-guidance {
        max-width: 860px;
      }

      .scaffold-group-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .interest-tab-guidance,
      .scaffold-family {
        padding: 20px 17px;
      }

      .scaffold-group-grid,
      .scaffold-reflection-grid {
        grid-template-columns: 1fr;
      }

      .scaffold-group-core {
        padding: 19px 18px 16px;
      }
    }

    /* Interest Holder refinements requested after first-family review. */
    .interest-fullscreen-hero {
      min-height: calc(100vh - var(--header-height));
      min-height: calc(100dvh - var(--header-height));
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #f3f8f8 0%, #ffffff 100%);
    }

    /* Keep the intro full-screen while restoring a little more breathing room
       at the left and right edges. */
    .interest-fullscreen-hero > .container,
    .potential-interest-section > .container,
    .interest-recommendations-section > .container {
      width: 100%;
      padding-inline: clamp(48px, 7vw, 140px);
    }

    .interest-scroll-prompt {
      cursor: pointer;
    }

    /* Account for the sticky header when using the smooth in-page jump. */
    #potential-interest-holders-title {
      scroll-margin-top: calc(var(--header-height) + 24px);
    }

    /* Let the Potential Interest Holders introduction use the same content
       width as the large scaffold card below it. */
    .potential-interest-section .section-heading,
    .potential-interest-section .section-heading p {
      width: 100%;
      max-width: none;
    }

    .scaffold-usage-guidance,
    .recommendation-guidance-list {
      margin: -10px 0 28px;
      padding: 17px 20px 17px 38px;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .scaffold-usage-guidance {
      width: 100%;
      max-width: none;
      background: white;
    }

    .scaffold-usage-guidance li + li,
    .recommendation-guidance-list li + li {
      margin-top: 7px;
    }

    .recommendation-guidance-list {
      max-width: 860px;
      margin-top: -8px;
      background: var(--surface);
    }

    .scaffold-family-header,
    .scaffold-family-definition,
    .scaffold-family-interest {
      max-width: none;
    }

    .scaffold-reflection-grid li {
      font-weight: 400;
    }

    /* Examples are open by default in the markup. Giving every open example
       area the same minimum height keeps the three cards visually aligned. */
    .scaffold-group-card {
      height: 100%;
    }

    .scaffold-group-core {
      flex: 1 1 auto;
    }

    .scaffold-examples[open] {
      min-height: 152px;
    }

    @media (max-width: 640px) {
      .interest-fullscreen-hero {
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .interest-fullscreen-hero > .container,
      .potential-interest-section > .container,
      .interest-recommendations-section > .container {
        padding-inline: 20px;
      }

      .scaffold-usage-guidance,
      .recommendation-guidance-list {
        margin-top: -6px;
        padding: 15px 16px 15px 34px;
      }

      /* A fixed visual rhythm is less important on the one-column mobile layout. */
      .scaffold-examples[open] {
        min-height: 0;
      }
    }


    /* ============================================================
       INTEREST HOLDER — FULL FAMILY SCAFFOLD / PROGRESSIVE DISCLOSURE
       ============================================================ */

    .family-overview {
      margin: 4px 0 30px;
      padding: clamp(20px, 3vw, 28px);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
    }

    .family-overview-heading {
      margin-bottom: 17px;
    }

    .family-overview-heading .placeholder-label {
      margin-bottom: 6px;
    }

    .family-overview-heading h3 {
      margin: 0;
      font-size: 1.16rem;
    }

    .family-overview-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 11px;
    }

    .family-overview-card {
      min-width: 0;
      min-height: 188px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        transform 140ms ease;
    }

    .family-overview-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .family-overview-card.is-active {
      background: #eef7f7;
      border-color: var(--accent);
    }

    .family-overview-number,
    .scaffold-family-number {
      display: block;
      margin-bottom: 7px;
      color: var(--accent-dark);
      font-size: 0.67rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .family-overview-title {
      display: block;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .family-overview-definition {
      display: block;
      margin-top: 9px;
      color: var(--ink-soft);
      font-size: 0.75rem;
      line-height: 1.47;
    }

    .family-overview-action {
      margin-top: auto;
      padding-top: 12px;
      color: var(--accent-dark);
      font-size: 0.72rem;
      font-weight: 780;
    }

    .scaffold-family-stack {
      display: grid;
      gap: 18px;
    }

    .scaffold-family {
      scroll-margin-top: calc(var(--header-height) + 24px);
      padding: 0;
      overflow: hidden;
    }

    .scaffold-family + .scaffold-family {
      margin-top: 0;
    }

    .scaffold-family-header {
      margin: 0;
      padding: clamp(24px, 3vw, 34px);
    }

    .scaffold-family-header h3 {
      margin-bottom: 10px;
    }

    .scaffold-family-definition {
      margin-bottom: 18px;
    }

    .scaffold-family-disclosure {
      min-height: 40px;
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-dark);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 780;
      cursor: pointer;
    }

    .scaffold-family-disclosure:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .scaffold-family-disclosure-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
    }

    .scaffold-family-content {
      padding: 0 clamp(24px, 3vw, 34px) clamp(24px, 3vw, 34px);
      border-top: 1px solid var(--line);
    }

    .scaffold-family-content > .scaffold-family-interest {
      margin-top: 26px;
    }

    .scaffold-group-grid.is-four-group {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .global-reflection-panel {
      margin-top: 30px;
      padding: clamp(24px, 4vw, 36px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .global-reflection-panel h3 {
      margin-bottom: 20px;
      font-size: clamp(1.28rem, 2vw, 1.62rem);
    }

    .global-reflection-panel .eyebrow {
      margin-bottom: 8px;
    }

    .global-reflection-grid li {
      font-weight: 400;
    }

    @media (max-width: 1280px) {
      .family-overview-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 920px) {
      .family-overview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .family-overview-card {
        min-height: 170px;
      }
    }

    @media (max-width: 640px) {
      .family-overview {
        padding: 17px;
      }

      .family-overview-grid,
      .scaffold-group-grid.is-four-group {
        grid-template-columns: 1fr;
      }

      .family-overview-card {
        min-height: auto;
      }

      .family-overview-action {
        margin-top: 12px;
      }

      .scaffold-family-header {
        padding: 20px 17px;
      }

      .scaffold-family-content {
        padding: 0 17px 20px;
      }
    }


    /* ============================================================
       INTEREST HOLDER — PREVIEW SCALE + EXPLICIT PLAN SELECTION
       ============================================================ */

    :root {
      --page-gutter: clamp(28px, 6vw, 112px);
    }

    .family-overview {
      padding: clamp(18px, 2.4vw, 24px);
    }

    .family-overview-heading h3 {
      font-size: 1.02rem;
    }

    .family-overview-grid {
      gap: 9px;
    }

    .family-overview-card {
      min-height: 174px;
      padding: 13px;
    }

    .family-overview-number {
      margin-bottom: 6px;
      font-size: 0.61rem;
    }

    .family-overview-title {
      font-size: 0.79rem;
      line-height: 1.31;
    }

    .family-overview-definition {
      margin-top: 7px;
      font-size: 0.68rem;
      line-height: 1.43;
    }

    .family-overview-action {
      padding-top: 10px;
      font-size: 0.66rem;
    }

    .plan-selection-context {
      margin: 0 0 22px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 320px);
      gap: 22px;
      align-items: center;
      background: white;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
    }

    .plan-selection-context .placeholder-label {
      margin-bottom: 5px;
    }

    .plan-selection-context h3 {
      margin: 0 0 5px;
      font-size: 0.95rem;
      line-height: 1.35;
    }

    .plan-selection-context p {
      max-width: 850px;
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .plan-selection-outcome-control {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .plan-selection-outcome-control > span {
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .plan-selection-outcome-control select {
      width: 100%;
      min-height: 40px;
      padding: 8px 34px 8px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font: inherit;
      font-size: 0.8rem;
    }

    .plan-selection-outcome-control small {
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .scaffold-group-card.is-plan-selected {
      background: #f2f9f9;
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(23, 108, 116, 0.14);
    }

    .scaffold-group-selection {
      padding: 10px 14px 12px;
      display: grid;
      gap: 6px;
      background: rgba(255, 255, 255, 0.74);
      border-top: 1px solid var(--line);
    }

    .scaffold-group-select-button {
      width: fit-content;
      max-width: 100%;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--accent-dark);
      background: transparent;
      border: 0;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 780;
      line-height: 1.35;
      cursor: pointer;
    }

    .scaffold-selection-indicator {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      font-size: 0.7rem;
    }

    .scaffold-group-select-button[aria-pressed="true"] .selection-indicator {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .scaffold-group-selection-meta {
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.4;
    }

    .custom-interest-holder-panel {
      margin-top: 24px;
      padding: clamp(22px, 3vw, 30px);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .custom-interest-holder-intro {
      max-width: 900px;
    }

    .custom-interest-holder-intro h3 {
      margin-bottom: 8px;
      font-size: 1.08rem;
    }

    .custom-interest-holder-intro p {
      margin-bottom: 18px;
      color: var(--ink-soft);
      font-size: 0.84rem;
    }

    .custom-interest-holder-form {
      display: grid;
      grid-template-columns: minmax(180px, 0.5fr) minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .custom-interest-holder-form label {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-self: start;
    }

    .custom-interest-holder-form label > span {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 760;
    }

    .custom-interest-holder-form label > span em {
      color: var(--muted);
      font-weight: 500;
    }

    .custom-interest-holder-form input,
    .custom-interest-holder-form textarea {
      width: 100%;
      min-height: 42px;
      padding: 9px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .custom-interest-holder-form textarea {
      min-height: 64px;
      resize: vertical;
    }

    .custom-interest-holder-form .button {
      min-height: 42px;
      padding: 9px 14px;
      align-self: end;
      font-size: 0.76rem;
    }

    .custom-interest-holder-list {
      margin-top: 18px;
      display: grid;
      gap: 9px;
    }

    .custom-interest-holder-item {
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .custom-interest-holder-item.is-selected {
      background: #f2f9f9;
      border-color: var(--accent);
    }

    .custom-interest-holder-item h4 {
      margin: 0 0 3px;
      color: var(--ink);
      font-size: 0.86rem;
    }

    .custom-interest-holder-item p {
      margin: 0 0 4px;
      color: var(--ink-soft);
      font-size: 0.76rem;
    }

    .custom-interest-holder-meta {
      color: var(--muted);
      font-size: 0.65rem;
    }

    .custom-interest-holder-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 12px;
    }

    .text-action-button {
      padding: 0;
      color: var(--accent-dark);
      background: transparent;
      border: 0;
      font-size: 0.7rem;
      font-weight: 760;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .text-action-button.quiet {
      color: var(--muted);
      font-weight: 650;
    }

    .interest-recommendation.recommendation-only {
      background: white;
    }

    .recommendation-static-heading {
      display: block;
    }

    .recommendation-only .recommendation-rationale {
      margin-left: 0;
    }

    /* Keep all five preview cards on one row at ordinary desktop widths. */
    @media (min-width: 1081px) {
      .family-overview-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (max-width: 1080px) {
      .family-overview-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .custom-interest-holder-form {
        grid-template-columns: 1fr 1fr;
      }

      .custom-interest-holder-form .button {
        width: fit-content;
      }
    }

    @media (max-width: 760px) {
      .family-overview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .plan-selection-context,
      .custom-interest-holder-form {
        grid-template-columns: 1fr;
      }

      .custom-interest-holder-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .custom-interest-holder-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 520px) {
      .family-overview-grid {
        grid-template-columns: 1fr;
      }
    }


    /* ============================================================
       INTEREST HOLDER — SELECTION MOVED TO OUTCOME RECOMMENDATIONS
       ============================================================ */

    /* The scaffold is educational only; selection happens below. */
    .plan-selection-context,
    .scaffold-group-selection {
      display: none;
    }

    .scaffold-group-card.is-plan-selected {
      background: var(--surface);
      border-color: var(--line);
      box-shadow: none;
    }

    /* Use the full available section width for the recommendation workflow. */
    .interest-recommendations-section .section-heading,
    .interest-recommendations-section .section-heading p,
    .interest-recommendations-section .selection-guide,
    .interest-recommendations-layout,
    .interest-recommendation-detail {
      width: 100%;
      max-width: none;
    }

    .recommendation-use-guide {
      margin: -8px 0 22px;
      padding: 18px 20px;
      background: var(--surface);
      border-left: 4px solid var(--accent);
    }

    .recommendation-use-guide .placeholder-label {
      margin-bottom: 8px;
    }

    .recommendation-use-guide ul {
      margin: 0;
      padding-left: 20px;
      color: var(--ink-soft);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .recommendation-use-guide li + li {
      margin-top: 7px;
    }

    .interest-recommendations-layout {
      display: grid;
      gap: 18px;
    }

    .interest-recommendations-section .interest-outcome-navigation {
      position: static;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .interest-recommendations-section .interest-outcome-navigation .outcome-button {
      min-height: 46px;
      text-align: left;
    }

    .interest-recommendation-detail {

    function getRoute() {

    function PageLink({ route, children, secondary = false }) {
      return (
        <a

        </a>
      );

    function Navigation({ route }) {
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        setMenuOpen(false);

      function renderLinks(className) {
        return NAVIGATION.map((item) => (
          <a
            key={item.id}
            className={className}
            href={`#${item.id}`}
            aria-current={route === item.id ? "page" : undefined}
            onClick={() => setMenuOpen(false)}
          >
            {item.label}
          </a>
        ));

    function CitationText({ text }) {
      const isStructuredText =
        text !== null && typeof text === "object";
      const displayText = isStructuredText ? text.text : text;

      if (isStructuredText) {
        return (
          <>
            {displayText}
            {text.citations?.length > 0 && (
              <sup className="citation">
                {text.citations.join(",")}
              </sup>
            )}
          </>
        );
      }

      const citationMatch = displayText.match(
        /(1,11|6,7|9,10|3–5|6|7|8|10)(?=(?:\s+(?:ACOG ePoster Library|ScienceDirect))?\s*$)/
      );

      if (!citationMatch) {
        return <>{displayText}</>;
      }

      const citationStart = citationMatch.index;
      const citationEnd =
        citationStart + citationMatch[0].length;

      return (
        <>
          {displayText.slice(0, citationStart)}
          <sup className="citation">{citationMatch[0]}</sup>
          {displayText.slice(citationEnd)}
        </>
      );
    }

                                <span>Notes</span>

                      );

                <div>

                  <p>

                    Evaluation Plan, where you can review and refine them before

                <PageLink route="evaluation-strategies">
                  Continue to Evaluation Strategies
                  <span aria-hidden="true">→</span>
                </PageLink>
              </div>
            </div>
          </section>
        </>
      );
    }

    function StrategyReferenceLinks({ metadata }) {
      const citations = metadata?.citations || [];
      const resources = metadata?.resources || [];

      if (citations.length === 0 && resources.length === 0) {
        return null;
      }

      return (
        <div className="strategy-row-meta">
          {citations.length > 0 && (
            <div className="strategy-meta-group">
              <span className="strategy-meta-label">
                Citation / original article
              </span>
              {citations.map((citation) => (
                <a
                  className="strategy-resource-link"
                  href={citation.url}
                  target="_blank"
                  rel="noreferrer"
                  key={`${citation.label}-${citation.url}`}
                >
                  {citation.label}
                  <span aria-hidden="true"> ↗</span>
                </a>
              ))}
            </div>
          )}

          {resources.length > 0 && (
            <div className="strategy-meta-group">
              <span className="strategy-meta-label">
                Instrument / resource
              </span>
              {resources.map((resource) => (
                <a
                  className="strategy-resource-link"
                  href={resource.url}
                  target="_blank"
                  rel="noreferrer"
                  key={`${resource.label}-${resource.url}`}
                >
                  {resource.label}
                  <span aria-hidden="true"> ↗</span>
                </a>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ExploreEvaluationStrategiesPage({
      evaluationStrategySelections,
      onToggleEvaluationStrategy,
      evaluationStrategyNotes,
      onUpdateEvaluationStrategyNote,
      interviewPromptSelections,
      onToggleInterviewPrompt,
    }) {
      const [selectedOutcomeId, setSelectedOutcomeId] = useState(
        OUTCOMES[0].id
      );
      const selectedOutcome =
        OUTCOMES.find(
          (outcome) => outcome.id === selectedOutcomeId
        ) || OUTCOMES[0];
      const selectedForOutcome =
        evaluationStrategySelections[selectedOutcome.id] || {};
      const notesForOutcome =
        evaluationStrategyNotes[selectedOutcome.id] || {};
      const promptsForOutcome =
        interviewPromptSelections[selectedOutcome.id] || [];
      const totalSelections = Object.values(
        evaluationStrategySelections
      ).reduce(
        (total, outcomeSelections) =>
          total +
          Object.values(outcomeSelections).reduce(
            (outcomeTotal, groupSelections) =>
              outcomeTotal + groupSelections.length,
            0
          ),
        0
      );
      const totalPromptSelections = Object.values(
        interviewPromptSelections
      ).reduce(
        (total, promptSelections) =>
          total + promptSelections.length,
        0
      );

      function getOutcomeSelectionCount(outcomeId) {
        return Object.values(
          evaluationStrategySelections[outcomeId] || {}
        ).reduce(
          (total, groupSelections) =>
            total + groupSelections.length,
          0
        );
      }

      function selectOutcome(outcomeId) {
        setSelectedOutcomeId(outcomeId);
      }

      function handleOutcomeKeyDown(event, currentIndex) {
        let nextIndex = currentIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          nextIndex = (currentIndex + 1) % OUTCOMES.length;
        } else if (
          event.key === "ArrowUp" ||
          event.key === "ArrowLeft"
        ) {
          nextIndex =
            (currentIndex - 1 + OUTCOMES.length) %
            OUTCOMES.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = OUTCOMES.length - 1;
        } else {
          return;
        }

        event.preventDefault();
        selectOutcome(OUTCOMES[nextIndex].id);
        document
          .getElementById(
            `strategy-outcome-tab-${OUTCOMES[nextIndex].id}`
          )
          ?.focus();
      }

      return (
        <>
          <section
            className="hero compact evaluation-strategies-fullscreen-hero"
            aria-labelledby="evaluation-strategies-page-title"
          >
            <div className="container">
              <div className="eyebrow">Guide Step 3</div>

              <h1 id="evaluation-strategies-page-title">
                Discover Evaluation Strategies
              </h1>

              <p className="lede">
                <em>Evaluation strategies</em> in this guide refer to structured
                approaches for <strong><code className="term-code">gathering and interpreting evidence</code></strong>{" "}
                to evaluate implementation outcomes or anticipate implementation-related
                challenges during mid-design.
              </p>

              <p className="strategy-intro-detail">
                <strong>Qualitative strategies</strong> can help explain context,
                experience, workflow fit, perceived barriers and facilitators, and why
                implementation may or may not work. <strong>Quantitative strategies</strong>{" "}
                can help measure patterns, extent, variation, and change across
                individuals, groups, or settings.
              </p>

              <p className="strategy-intro-detail">
                When appropriate, integrating qualitative and quantitative evidence
                through <strong>mixed methods</strong> is strongly encouraged because it
                can provide a richer understanding of implementation by connecting
                measurable patterns with contextual explanations (Green et al., 2015).
                When these forms of evidence are intentionally integrated, mixed methods
                can support more informed mid-design decisions.
                <sup className="citation">2–4</sup>
              </p>

              <p className="strategy-intro-instruction">
                Select one implementation outcome at a time to review its quantitative
                and qualitative evaluation strategies, and indicate which ones you may
                want to include in your evaluation plan.
              </p>

              <button
                className="scroll-prompt evaluation-strategies-scroll-prompt"
                type="button"
                onClick={() =>
                  document
                    .getElementById("evaluation-strategies-content")
                    ?.scrollIntoView({ behavior: "smooth", block: "start" })
                }
              >
                Discover Evaluation Strategies
                <span className="scroll-arrow" aria-hidden="true">↓</span>
              </button>
            </div>
          </section>

          <section id="evaluation-strategies-content" className="section soft">
            <div className="container">
              <div
                className="strategy-selection-summary"
                aria-live="polite"
              >
                <strong>{totalSelections}</strong>{" "}
                {totalSelections === 1
                  ? "strategy selected"
                  : "strategies selected"}
                {" · "}
                <strong>{totalPromptSelections}</strong>{" "}
                {totalPromptSelections === 1
                  ? "interview prompt selected"
                  : "interview prompts selected"}
              </div>

              <div className="outcome-layout">
                <div
                  className="outcome-navigation strategy-outcome-navigation"
                  role="tablist"
                  aria-label="Outcomes for evaluation strategies"
                >
                  {OUTCOMES.map((outcome, index) => {
                    const selectionCount =
                      getOutcomeSelectionCount(outcome.id);

                    return (
                      <button
                        key={outcome.id}
                        id={`strategy-outcome-tab-${outcome.id}`}
                        className="outcome-button"
                        type="button"
                        role="tab"
                        aria-selected={
                          selectedOutcome.id === outcome.id
                        }
                        aria-controls="strategy-outcome-detail-panel"
                        tabIndex={
                          selectedOutcome.id === outcome.id ? 0 : -1
                        }
                        onClick={() => selectOutcome(outcome.id)}
                        onKeyDown={(event) =>
                          handleOutcomeKeyDown(event, index)
                        }
                      >
                        <span>{outcome.name}</span>
                        {selectionCount > 0 && (
                          <span
                            className="outcome-selection-count"
                            aria-label={`${selectionCount} selected`}
                          >
                            {selectionCount}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>

                <article
                  id="strategy-outcome-detail-panel"
                  className="outcome-detail"
                  role="tabpanel"
                  aria-live="polite"
                  aria-labelledby={`strategy-outcome-tab-${selectedOutcome.id}`}
                >
                  <div className="eyebrow">
                    {selectedOutcome.name}
                  </div>

                  <h2>
                    Evaluation strategies for {selectedOutcome.name}
                  </h2>

                  {EVALUATION_STRATEGY_GROUPS.map((group) => {
                    const strategies = group.strategies.filter(
                      (strategy) =>
                        strategy.outcomeId === selectedOutcome.id
                    );
                    const includesInterview =
                      group.id === "qualitative";
                    const availableStrategyCount =
                      strategies.length + (includesInterview ? 1 : 0);
                    const selectedInGroup = new Set(
                      selectedForOutcome[group.id] || []
                    );

                    return (
                      <section
                        className="strategy-outcome-group"
                        aria-labelledby={`${selectedOutcome.id}-${group.id}-strategies-title`}
                        key={group.id}
                      >
                        <div className="strategy-category-header">
                          <h3
                            id={`${selectedOutcome.id}-${group.id}-strategies-title`}
                          >
                            {group.title}
                          </h3>

                          <div
                            className="strategy-category-count"
                            aria-live="polite"
                          >
                            {selectedInGroup.size} of{" "}
                            {availableStrategyCount} selected
                          </div>
                        </div>

                        {availableStrategyCount > 0 ? (
                          <div className="strategy-list">
                            {includesInterview && (
                              <InterviewStrategyRow
                                outcomeId={selectedOutcome.id}
                                isSelected={selectedInGroup.has(
                                  INTERVIEW_STRATEGY.id
                                )}
                                selectedPromptIds={promptsForOutcome}
                                note={
                                  notesForOutcome[
                                    INTERVIEW_STRATEGY.id
                                  ] || ""
                                }
                                onToggle={
                                  onToggleEvaluationStrategy
                                }
                                onTogglePrompt={
                                  onToggleInterviewPrompt
                                }
                                onUpdateNote={
                                  onUpdateEvaluationStrategyNote
                                }
                              />
                            )}

                            {strategies.map((strategy) => (
                              <EvaluationStrategyRow
                                key={strategy.id}
                                strategy={strategy}
                                outcomeId={selectedOutcome.id}
                                groupId={group.id}
                                isSelected={selectedInGroup.has(
                                  strategy.id
                                )}
                                note={
                                  notesForOutcome[strategy.id] || ""
                                }
                                onToggle={
                                  onToggleEvaluationStrategy
                                }
                                onUpdateNote={
                                  onUpdateEvaluationStrategyNote
                                }
                              />
                            ))}
                          </div>
                        ) : (
                          <div className="strategy-empty-state">
                            No {group.id} strategies were listed for
                            this outcome in the Round 2 prototype.
                          </div>
                        )}
                      </section>
                    );
                  })}
                </article>
              </div>

              <div className="next-step interest-next-step">
                <div>
                  <h2>Continue to your evaluation plan</h2>
                  <p>
                    Your selections remain connected to their
                    respective implementation outcomes.
                  </p>
                </div>

                <PageLink route="final-plan">
                  Continue to Final Evaluation Plan
                  <span aria-hidden="true">→</span>
                </PageLink>
              </div>
            </div>
          </section>
        </>
      );
    }

    function FinalEvaluationPlanPage() {
      return (
        <WorkflowPlaceholderPage
          step="4"
          pageId="final-plan"
          title="Final Evaluation Plan"
          lede={
            "This page will bring your selected implementation outcomes, interest holders, rationales, and evaluation strategies together for review."
          }
          placeholderTitle={
            "Plan review and export are coming in a later pass"
          }
          placeholderText={
            "Selection logic, the project-specific plan summary, customization, and download or export behavior will be added here later."
          }
          nextRoute="resources"
          nextLabel="Continue to Resources"
        />
      );
    }

    // ============================================================
    // RESOURCES PAGE
    // ============================================================

    function ResourcesPage() {
      return (
        <>
          <section
            className="hero compact"
            aria-labelledby="resources-page-title"
          >
            <div className="container">
              <div className="eyebrow">
                Supporting material
              </div>

              <h1 id="resources-page-title">Resources</h1>

              <p className="lede">
                Use these resources throughout the guide. They support
                reasoning and planning but are not a required final
                step in the workflow.
              </p>
            </div>
          </section>

          <section className="section">
            <div className="container">
              <div className="resource-grid">
                {RESOURCES.map((resource) => (
                  <article
                    className="resource-card"
                    key={resource.title}
                  >
                    <h2>{resource.title}</h2>
                    <p>{resource.description}</p>

                    <span className="placeholder-label">
                      Content coming in a later pass
                    </span>
                  </article>
                ))}
              </div>
            </div>
          </section>
        </>
      );
    }

    // ============================================================
    // APPLICATION
    // ============================================================

    function App() {
      const [route, setRoute] = useState(getRoute());
      const [implementationOutcomeSelections, setImplementationOutcomeSelections] =
        useState([]);
      const [interestHolderSelections, setInterestHolderSelections] =
        useState({});
      const [interestHolderDetails, setInterestHolderDetails] =
        useState({});
      const [customInterestHolderGroups, setCustomInterestHolderGroups] =
        useState([]);
      const [customInterestHolderSelections, setCustomInterestHolderSelections] =
        useState({});
      const [
        evaluationStrategySelections,
        setEvaluationStrategySelections,
      ] = useState({});
      const [evaluationStrategyNotes, setEvaluationStrategyNotes] =
        useState({});
      const [interviewPromptSelections, setInterviewPromptSelections] =
        useState({});

      function toggleImplementationOutcome(outcomeId) {
        setImplementationOutcomeSelections((currentSelections) => {
          const nextSelections = new Set(currentSelections);

          if (nextSelections.has(outcomeId)) {
            nextSelections.delete(outcomeId);
          } else {
            nextSelections.add(outcomeId);
          }

          return Array.from(nextSelections);
        });
      }

      function toggleInterestHolder(outcomeId, roleId) {
        setInterestHolderSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(roleId)) {
            currentOutcomeSelections.delete(roleId);
          } else {
            currentOutcomeSelections.add(roleId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      function addCustomInterestHolder(outcomeId, name, note) {
        const customId = `custom-${Date.now()}-${Math.random()
          .toString(36)
          .slice(2, 8)}`;

        setCustomInterestHolderGroups((currentGroups) => [
          ...currentGroups,
          {
            id: customId,
            name,
            note,
          },
        ]);

        setCustomInterestHolderSelections((currentSelections) => ({
          ...currentSelections,
          [outcomeId]: [
            ...(currentSelections[outcomeId] || []),
            customId,
          ],
        }));
      }

      function toggleCustomInterestHolder(outcomeId, customId) {
        setCustomInterestHolderSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(customId)) {
            currentOutcomeSelections.delete(customId);
          } else {
            currentOutcomeSelections.add(customId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      function removeCustomInterestHolder(customId) {
        setCustomInterestHolderGroups((currentGroups) =>
          currentGroups.filter((group) => group.id !== customId)
        );

        setCustomInterestHolderSelections((currentSelections) => {
          const nextSelections = {};

          Object.entries(currentSelections).forEach(
            ([outcomeId, outcomeSelections]) => {
              nextSelections[outcomeId] = outcomeSelections.filter(
                (id) => id !== customId
              );
            }
          );

          return nextSelections;
        });
      }

      function updateInterestHolderDetail(
        outcomeId,
        roleId,
        field,
        value
      ) {
        setInterestHolderDetails((currentDetails) => ({
          ...currentDetails,
          [outcomeId]: {
            ...(currentDetails[outcomeId] || {}),
            [roleId]: {
              ...(currentDetails[outcomeId]?.[roleId] || {}),
              [field]: value,
            },
          },
        }));
      }

      function toggleEvaluationStrategy(
        outcomeId,
        groupId,
        strategyId
      ) {
        setEvaluationStrategySelections((currentSelections) => {
          const currentOutcomeSelections =
            currentSelections[outcomeId] || {};
          const currentGroupSelections = new Set(
            currentOutcomeSelections[groupId] || []
          );

          if (currentGroupSelections.has(strategyId)) {
            currentGroupSelections.delete(strategyId);
          } else {
            currentGroupSelections.add(strategyId);
          }

          return {
            ...currentSelections,
            [outcomeId]: {
              ...currentOutcomeSelections,
              [groupId]: Array.from(currentGroupSelections),
            },
          };
        });
      }

      function updateEvaluationStrategyNote(
        outcomeId,
        strategyId,
        value
      ) {
        setEvaluationStrategyNotes((currentNotes) => ({
          ...currentNotes,
          [outcomeId]: {
            ...(currentNotes[outcomeId] || {}),
            [strategyId]: value,
          },
        }));
      }

      function toggleInterviewPrompt(outcomeId, promptId) {
        setInterviewPromptSelections((currentSelections) => {
          const currentOutcomeSelections = new Set(
            currentSelections[outcomeId] || []
          );

          if (currentOutcomeSelections.has(promptId)) {
            currentOutcomeSelections.delete(promptId);
          } else {
            currentOutcomeSelections.add(promptId);
          }

          return {
            ...currentSelections,
            [outcomeId]: Array.from(currentOutcomeSelections),
          };
        });
      }

      useEffect(() => {
        function handleHashChange() {
          const hash = window.location.hash.replace("#", "");
          const nextRoute = getRoute();

          if (hash === "main-content") {
            window.requestAnimationFrame(() => {
              document.getElementById("main-content")?.focus();
            });

            return;
          }

          if (START_SECTION_HASHES.includes(hash)) {
            setRoute("start");

            window.requestAnimationFrame(() => {
              document
                .getElementById(hash)
                ?.scrollIntoView({
                  behavior: "smooth",
                  block: "start",
                });
            });

            return;
          }

          setRoute(nextRoute);
          window.scrollTo({
            top: 0,
            behavior: "auto",
          });
        }

        window.addEventListener(
          "hashchange",
          handleHashChange
        );

        if (!window.location.hash) {
          window.history.replaceState(
            null,
            "",
            "#start"
          );
        } else if (
          START_SECTION_HASHES.includes(
            window.location.hash.replace("#", "")
          )
        ) {
          handleHashChange();
        }

        return () =>
          window.removeEventListener(
            "hashchange",
            handleHashChange
          );
      }, []);

      let currentPage;

      if (route === "outcomes") {
        currentPage = (
          <ExploreOutcomesPage
            implementationOutcomeSelections={
              implementationOutcomeSelections
            }
            onToggleImplementationOutcome={
              toggleImplementationOutcome
            }
          />
        );
      } else if (route === "interest-holders") {
        currentPage = (
          <ExploreInterestHoldersPage
            interestHolderSelections={interestHolderSelections}
            onToggleInterestHolder={toggleInterestHolder}
            interestHolderDetails={interestHolderDetails}
            onUpdateInterestHolderDetail={updateInterestHolderDetail}
            customInterestHolderGroups={customInterestHolderGroups}
            customInterestHolderSelections={customInterestHolderSelections}
            onAddCustomInterestHolder={addCustomInterestHolder}
            onToggleCustomInterestHolder={toggleCustomInterestHolder}
            onRemoveCustomInterestHolder={removeCustomInterestHolder}
          />
        );
      } else if (route === "evaluation-strategies") {
        currentPage = (
          <ExploreEvaluationStrategiesPage
            evaluationStrategySelections={
              evaluationStrategySelections
            }
            onToggleEvaluationStrategy={
              toggleEvaluationStrategy
            }
            evaluationStrategyNotes={evaluationStrategyNotes}
            onUpdateEvaluationStrategyNote={
              updateEvaluationStrategyNote
            }
            interviewPromptSelections={
              interviewPromptSelections
            }
            onToggleInterviewPrompt={toggleInterviewPrompt}
          />
        );
      } else if (route === "final-plan") {
        currentPage = <FinalEvaluationPlanPage />;
      } else if (route === "resources") {
        currentPage = <ResourcesPage />;
      } else {
        currentPage = <StartHerePage />;
      }

      return (
        <>
          <Navigation route={route} />

          <main id="main-content" tabIndex="-1">
            {currentPage}
          </main>

          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);
  </script>
</body>
</html>
